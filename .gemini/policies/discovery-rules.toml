# ==============================================================================
# Discovery & Inspection Policies
# ==============================================================================

[[rule]]
toolName = "run_shell_command"
commandPrefix = ["ls", "cat", "grep", "find", "pwd", "tail", "head", "du", "df", "stat", "file", "which", "ps", "pgrep", "ss", "lsof"]
decision = "allow"
priority = 100
reason = "Allow common discovery, read-only, and system inspection commands to streamline research."
