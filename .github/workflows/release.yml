name: Release (Lint, Test, Build & Deploy)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Môi trường triển khai (Deployment Environment)'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  # ============================================================================
  # BUILD PHASE (Parallel, Create Test Cache)
  # ============================================================================
  build-api:
    name: 🏗️ Build API Server (Test Cache)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ./apiserver
          target: test
          push: false
          cache-from: type=gha,scope=apiserver
          cache-to: type=gha,mode=max,scope=apiserver

  build-agent:
    name: 🏗️ Build Edge Agent (Test Cache)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ./agent-main
          target: test
          push: false
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent

  build-web:
    name: 🏗️ Build Web Dashboard (Test Cache)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ./webdashboard
          target: test
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # ============================================================================
  # LINT PHASE
  # ============================================================================
  lint:
    name: 🎨 Lint & Format
    needs: [build-api, build-agent, build-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Environment
        run: echo "CONTAINER_ENGINE=docker" >> $GITHUB_ENV

      - uses: docker/setup-buildx-action@v3
      - name: Load Pre-built Images
        uses: docker/build-push-action@v5
        with:
          context: ./apiserver
          target: test
          load: true
          cache-from: type=gha,scope=apiserver
      - uses: docker/build-push-action@v5
        with:
          context: ./agent-main
          target: test
          load: true
          cache-from: type=gha,scope=agent
      - uses: docker/build-push-action@v5
        with:
          context: ./webdashboard
          target: test
          load: true
          cache-from: type=gha,scope=web

      - name: 🎨 Run Infrastructure Lint
        run: ./test.sh infra --lint-only

      - name: 🎨 Run Backend Lint
        run: ./test.sh api --lint-only

      - name: 🎨 Run Frontend Lint
        run: ./test.sh web --lint-only

  # ============================================================================
  # TEST PHASE
  # ============================================================================
  test:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Environment
        run: echo "CONTAINER_ENGINE=docker" >> $GITHUB_ENV

      - uses: docker/setup-buildx-action@v3
      - name: Load Pre-built Images
        uses: docker/build-push-action@v5
        with:
          context: ./apiserver
          target: test
          load: true
          cache-from: type=gha,scope=apiserver
      - uses: docker/build-push-action@v5
        with:
          context: ./agent-main
          target: test
          load: true
          cache-from: type=gha,scope=agent
      - uses: docker/build-push-action@v5
        with:
          context: ./webdashboard
          target: test
          load: true
          cache-from: type=gha,scope=web

      - name: 🧪 Run Full-Stack Unit Tests
        run: ./test.sh all --unit-only

  # ============================================================================
  # BUILD & PUSH PHASE (Production Artifacts)
  # ============================================================================
  build-push-backend:
    name: 🏗️ Build & Push Backend
    runs-on: ubuntu-latest
    needs: test
    environment: ${{ github.event.inputs.environment }}
    env:
      DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
      APISERVER_IMAGE: ${{ secrets.DOCKER_REGISTRY }}/${{ vars.APISERVER_IMAGE_NAME || 'leeattend-apiserver' }}
      AGENT_IMAGE: ${{ secrets.DOCKER_REGISTRY }}/${{ vars.AGENT_IMAGE_NAME || 'leeattend-agent-main' }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/setup-buildx-action@v3

      - name: Extract metadata for apiserver
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.APISERVER_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build & Push apiserver
        uses: docker/build-push-action@v5
        with:
          context: ./apiserver
          target: runtime
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: |
            type=gha,scope=apiserver
            type=gha,scope=apiserver-runtime
          cache-to: type=gha,mode=max,scope=apiserver-runtime

      - name: Extract metadata for agent-main
        id: meta-agent
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.AGENT_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build & Push agent-main
        uses: docker/build-push-action@v5
        with:
          context: ./agent-main
          target: runtime
          push: true
          tags: ${{ steps.meta-agent.outputs.tags }}
          labels: ${{ steps.meta-agent.outputs.labels }}
          cache-from: |
            type=gha,scope=agent
            type=gha,scope=agent-runtime
          cache-to: type=gha,mode=max,scope=agent-runtime

  # ============================================================================
  # DEPLOY PHASE
  # ============================================================================
  deploy-frontend:
    name: ☁️ Deploy Frontend
    runs-on: ubuntu-latest
    needs: test
    environment: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
          CLOUDFLARE_BRANCH: ${{ github.event.inputs.environment == 'production' && 'main' || github.event.inputs.environment }}
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://attapi.vlee.dev/api' }}
        run: |
          ./scripts/deploy-dashboard.sh
