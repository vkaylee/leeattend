name: Go API Gates

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apiserver/**'
      - '.compose/go/**'
      - '.compose/docker-compose.test.yml'
      - 'scripts/_go-gates.sh'
      - 'leedevkit.toml'
      - '.github/workflows/go-gates.yml'

env:
  COMPOSE_PROJECT_NAME: leeattend-go-gates
  DOCKER_BUILDKIT: 1

jobs:
  go-gates:
    name: 🔒 Go Build Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build pinned Go gate image
        run: docker build -t localhost/leeattend-test_go -f .compose/go/Dockerfile .compose/go

      - name: Lint gates (gofmt, vet, staticcheck, golangci-lint, govulncheck, mod verify)
        run: ./scripts/_go-gates.sh --lint-only

      - name: Unit gates (-race)
        run: ./scripts/_go-gates.sh --unit-only

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: go-gate-logs
          path: logs/gate_*.log
          retention-days: 7

  generated-code-diff:
    name: 🧬 Generated Code Freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build pinned Go gate image
        run: docker build -t localhost/leeattend-test_go -f .compose/go/Dockerfile .compose/go

      - name: Fail on generated-code diff
        run: |
          set -euo pipefail
          if [ -f sqlc.yaml ] || [ -f sqlc.json ]; then
            docker run --rm -v "$PWD:/workspace" -w /workspace/apiserver \
              localhost/leeattend-test_go sqlc diff
          fi
          if [ -f oapi-codegen.yaml ] || [ -f internal/api/oapi-codegen.yaml ]; then
            docker run --rm -v "$PWD:/workspace" -w /workspace/apiserver \
              localhost/leeattend-test_go bash -c \
              'git config --global --add safe.directory /workspace && oapi-codegen --config internal/api/oapi-codegen.yaml ../../shared/openapi.json && git diff --exit-code internal/api'
          fi
          echo "Generated-code freshness check passed."
