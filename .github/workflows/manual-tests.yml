name: '🧪 Manual Test Suite'

on:
  workflow_dispatch:
    inputs:
      test_target:
        description: 'Test target to run'
        required: true
        default: '--all'
        type: choice
        options:
          - '--all'
          - '--api'
          - '--web'
          - '--integration'
      filter:
        description: 'Specific test pattern (optional) e.g. "auth" or "attendance"'
        required: false
        type: string
        default: ''
      timeout:
        description: 'Global Timeout (seconds)'
        required: false
        type: string
        default: '1800'

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  # ============================================================================
  # BUILD PHASE (Parallel)
  # ============================================================================
  build-api:
    name: 🏗️ Build API Server
    if: inputs.test_target == '--all' || inputs.test_target == '--api' || inputs.test_target == '--integration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apiserver/Dockerfile
          target: test
          push: false
          cache-from: type=gha,scope=apiserver
          cache-to: type=gha,mode=max,scope=apiserver


  build-web:
    name: 🏗️ Build Web Dashboard
    if: inputs.test_target == '--all' || inputs.test_target == '--web'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ./webdashboard
          target: test
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # ============================================================================
  # API PIPELINE (Lint -> Unit -> Integration)
  # ============================================================================
  lint-api:
    name: 🧹 Lint API
    needs: [build-api]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Load Pre-built Images
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apiserver/Dockerfile
          target: test
          load: true
          cache-from: type=gha,scope=apiserver
      - name: Run Lint
        run: |
          chmod +x leedevkit scripts/*.sh
          ./leedevkit test api --lint-only

  unit-api:
    name: 🧪 Unit Test API
    needs: [lint-api]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Load Pre-built Images
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apiserver/Dockerfile
          target: test
          load: true
          cache-from: type=gha,scope=apiserver
      - name: Run Unit Tests
        run: |
          chmod +x leedevkit scripts/*.sh
          ./leedevkit test api --unit-only

  integration-api:
    name: 🔗 Integration Test API
    needs: [unit-api]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Load Pre-built Images
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apiserver/Dockerfile
          target: test
          load: true
          cache-from: type=gha,scope=apiserver
      - name: Run Integration Tests
        run: |
          chmod +x leedevkit scripts/*.sh
          ./leedevkit test api --e2e-only

  # ============================================================================
  # WEB PIPELINE (Lint -> Unit -> E2E)
  # ============================================================================
  lint-web:
    name: 🧹 Lint Web Dashboard
    needs: [build-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Load Pre-built Image
        uses: docker/build-push-action@v5
        with:
          context: ./webdashboard
          target: test
          load: true
          cache-from: type=gha,scope=web
      - name: Run Lint
        run: |
          chmod +x leedevkit scripts/*.sh
          ./leedevkit test web --lint-only
      - name: 🌐 Run i18n Reconcile Check
        run: node scripts/locales/reconcile_locales.js

  unit-web:
    name: 🧪 Unit Test Web Dashboard
    needs: [lint-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Load Pre-built Image
        uses: docker/build-push-action@v5
        with:
          context: ./webdashboard
          target: test
          load: true
          cache-from: type=gha,scope=web
      - name: Run Unit Tests
        run: |
          chmod +x leedevkit scripts/*.sh
          ./leedevkit test web --unit-only

  e2e-web:
    name: 🎭 Playwright E2E Web
    needs: [unit-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Load Pre-built Image
        uses: docker/build-push-action@v5
        with:
          context: ./webdashboard
          target: test
          load: true
          cache-from: type=gha,scope=web
      - name: Run E2E Tests
        run: |
          chmod +x leedevkit scripts/*.sh
          ./leedevkit test web --e2e-only
      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-test-logs
          path: .test_logs/
          retention-days: 5
