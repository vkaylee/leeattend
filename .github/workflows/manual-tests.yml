name: '🧪 Manual Test Suite'

on:
  workflow_dispatch:
    inputs:
      test_target:
        description: 'Test target to run'
        required: true
        default: '--all'
        type: choice
        options:
          - '--all'
          - '--api'
          - '--web'
          - '--integration'
      filter:
        description: 'Specific test pattern (optional) e.g. "auth" or "attendance"'
        required: false
        type: string
        default: ''
      timeout:
        description: 'Global Timeout (seconds)'
        required: false
        type: string
        default: '1800'

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  run-tests:
    name: Run LeeAttend Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Cache API Server
        uses: docker/build-push-action@v5
        with:
          context: ./apiserver
          target: test
          load: true
          cache-from: type=gha,scope=apiserver
          cache-to: type=gha,mode=max,scope=apiserver

      - name: Build and Cache Agent
        uses: docker/build-push-action@v5
        with:
          context: ./agent-main
          target: test
          load: true
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent

      - name: Build and Cache Web
        uses: docker/build-push-action@v5
        with:
          context: ./webdashboard
          target: test
          load: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Make scripts executable
        run: |
          chmod +x run-tests.sh setup-test-env.sh scripts/*.sh
          
      - name: Run LeeAttend Test Suite
        env:
          TIMEOUT_GLOBAL: ${{ inputs.timeout }}
        run: |
          # The images are already built and loaded into Docker by Buildx
          if [ -n "${{ inputs.filter }}" ]; then
            ./run-tests.sh ${{ inputs.test_target }} --test="${{ inputs.filter }}"
          else
            ./run-tests.sh ${{ inputs.test_target }}
          fi
          
      - name: Upload Test Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: .test_logs/
          retention-days: 5
