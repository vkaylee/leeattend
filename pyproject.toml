[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "RET", "SIM", "PTH", "ANN", "S", "PT"]
ignore = ["D", "S603"]

[tool.ruff.lint.per-file-ignores]
"scripts/tests/*" = ["S", "ANN", "PT"]
"scripts/test_safe_run.py" = ["S", "ANN", "PT"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unused_configs = true
mypy_path = "scripts"

[[tool.mypy.overrides]]
module = "psutil.*"
ignore_missing_imports = true


