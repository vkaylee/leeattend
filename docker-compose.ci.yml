# ==============================================================================
# Docker Compose — CI Override
# ==============================================================================
# Applied ONLY in CI environments (when CI=true) by run-tests.sh.
# NOT applied during local development.
#
# PURPOSE:
#   In CI, source code is already COPY'd into the Docker image by the Dockerfile.
#   We don't need (or want) bind-mount volumes from the host.
#   This override replaces the host-mounted volumes with anonymous volumes
#   so the pre-built layers from cargo-chef are used directly.
#
# USAGE:
#   docker compose -f docker-compose.yml -f docker-compose.test.yml -f docker-compose.ci.yml up
#   (automatically handled by run-tests.sh when CI=true)
# ==============================================================================

services:

  # Override apiserver_test to use Dockerfile's built-in code + deps
  apiserver_test:
    working_dir: /app                    # Match Dockerfile WORKDIR (not /workspace)
    volumes:
      - /app/target                      # Anonymous volume for build artifacts
      - /sccache                         # Anonymous volume for sccache
    environment:
      - CARGO_TARGET_DIR=/app/target     # Match the volume path above
      - SCCACHE_DIR=/sccache

  # Override agent_test — same strategy
  agent_test:
    working_dir: /app
    volumes:
      - /app/target
      - /sccache
    environment:
      - CARGO_TARGET_DIR=/app/target
      - SCCACHE_DIR=/sccache

  # Override web_test — use Dockerfile's installed node_modules
  web_test:
    working_dir: /app
    volumes:
      - /app/node_modules                # Use Dockerfile's pre-installed packages
