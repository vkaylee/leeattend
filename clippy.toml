# clippy.toml - Enterprise Diamond Standards
# Cơ chế kiểm soát mã nguồn tự động, chặn mọi rủi ro do AI hoặc Dev bất cẩn.

# 1. BANNED METHODS (Cấm các hàm gây Panic hoặc vi phạm kiến trúc)
disallowed-methods = [
    # Cấm thoát đột ngột (Buộc phải Graceful Shutdown)
    "std::process::exit",
    "std::process::abort"
]

# 2. BANNED MACROS (Cấm các macro không chuẩn)
disallowed-macros = [
    # Cấm in console bừa bãi (Buộc phải dùng tracing::info!, tracing::error!)
    "std::println",
    "std::print",
    "std::eprintln",
    "std::eprint",
    
    # Cấm bỏ quên code debug trên Production
    "std::dbg",
    "std::todo",
    "std::unimplemented"
]

# 3. BANNED TYPES (Cấm các kiểu dữ liệu sai thiết kế cho Async)
disallowed-types = [
    # Trong môi trường tokio (async), std::sync::Mutex có thể gây Deadlock toàn hệ thống.
    # Bắt buộc phải dùng tokio::sync::Mutex hoặc parking_lot::Mutex
    "std::sync::Mutex",
    "std::sync::RwLock"
]
