[devkit]
version = "0.7.27"
install = "per-project"
source = "release"

[project]
name = "LeeAttend"
namespace = "leeattend"
languages = ["typescript", "go"]

[services.apiserver]
dockerfile = "./apiserver"
lang = "go"
workdir = "apiserver"
ports = [3000]
health_check = "/api/v1/health"
go = true

[services.webdashboard]
dockerfile = "./webdashboard"
lang = "typescript"
ports = [5173]
bun = true


[targets]
api = ["apiserver"]
web = ["webdashboard"]
all = ["apiserver", "webdashboard"]

[test.dependencies]
lint-api = ["apiserver"]
unit-api = ["apiserver"]
int-api = ["apiserver"]
lint-go = ["apiserver"]
unit-go = ["apiserver"]
int-go = ["apiserver"]

[ai]
rules_dir = ".attendagent/rules"
override_manifest = ".attendagent/overrides.yaml"

[addons]
skills = [
    { url = "https://github.com/addyosmani/agent-skills.git", version = "main" },
]
