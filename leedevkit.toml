[devkit]
version = "0.12.0"
install = "global"
source = "release"

[project]
name = "LeeAttend"
namespace = "leeattend"
languages = ["typescript", "go"]

[services.apiserver]
dockerfile = "./apiserver"
lang = "go"
workdir = "apiserver"
ports = [3000]
health_check = "/api/v1/health"
go = true

[services.go]
lang = "go"
workdir = "apiserver"

[services.api]
lang = "go"
workdir = "apiserver"

[services.webdashboard]
dockerfile = "./webdashboard"
lang = "typescript"
ports = [5173]
bun = true

[targets]
api = ["api"]
web = ["webdashboard"]
all = ["api", "webdashboard"]

[test.dependencies]
lint-api = ["apiserver"]
unit-api = ["apiserver"]
int-api = ["apiserver"]
lint-go = ["apiserver"]
unit-go = ["apiserver"]
int-go = ["apiserver"]
lint-web = ["bun_init", "webdashboard"]
unit-web = ["bun_init", "webdashboard"]
e2e-web = ["bun_init", "webdashboard"]

[ai]
rules_dir = ".agent/rules"
override_manifest = ".agent/overrides.yaml"

[addons]
skills = [
    { url = "https://github.com/addyosmani/agent-skills.git", version = "main" },
]
