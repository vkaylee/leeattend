[devkit]
version = "0.8.4"
install = "per-project"
source = "release"

[project]
name = "LeeAttend"
namespace = "leeattend"
languages = ["typescript", "go"]

[services.apiserver]
dockerfile = "./apiserver"
lang = "go"
workdir = "apiserver"
ports = [3000]
health_check = "/api/v1/health"
go = true

[services.webdashboard]
dockerfile = "./webdashboard"
lang = "typescript"
ports = [5173]
bun = true

# LeeDevKit uses target names as execution modes. Keep API target on Go mode
# while Compose continues to provide apiserver container.
[services.api]
lang = "go"
workdir = "apiserver"

[services.go]
lang = "go"
workdir = "apiserver"

[targets]
api = ["api"]
web = ["webdashboard"]
all = ["api", "webdashboard"]

[test.dependencies]
lint-api = ["apiserver"]
unit-api = ["apiserver"]
int-api = ["apiserver"]
lint-go = ["apiserver"]
unit-go = ["apiserver"]
int-go = ["apiserver"]

[ai]
rules_dir = ".agent/rules"
override_manifest = ".agent/overrides.yaml"

[addons]
skills = [
    { url = "https://github.com/addyosmani/agent-skills.git", version = "main" },
]
