[project]
name = "LeeAttend"
namespace = "leeattend"
languages = ["typescript", "go"]

[services.apiserver]
dockerfile = "./apiserver"
lang = "go"
workdir = "apiserver"
ports = [3000]
health_check = "/api/v1/health"
go = true

[services.webdashboard]
dockerfile = "./webdashboard"
lang = "typescript"
ports = [5173]
bun = true

[targets]
api = ["apiserver"]
web = ["webdashboard"]
all = ["apiserver", "webdashboard"]

[test.dependencies]
lint-api = ["apiserver"]
unit-api = ["apiserver"]
int-api = ["apiserver"]
lint-web = ["bun_init", "webdashboard"]
unit-web = ["bun_init", "webdashboard"]
e2e-web = ["bun_init", "webdashboard"]

[test.gates.int-api]
setup_command = ["sh", "-ec", "for phase in foundation hr_core attendance_schedule payroll; do psql \"$DB_PRIMARY_URL\" -v ON_ERROR_STOP=1 -f migrations/phases/$phase/up.sql; done; psql \"$DB_PRIMARY_URL\" -v ON_ERROR_STOP=1 -v seed_effective_date=$(date -u +%F) -f migrations/phases/runtime_seeds.up.sql; psql \"$DB_PRIMARY_URL\" -v ON_ERROR_STOP=1 -f migrations/testdata/phased_schema_contract.sql"]
env = { LEEATTEND_DB_INTEGRATION = "1" }
required_env = ["DB_PRIMARY_URL"]

[ai]
rules_dir = ".agent/rules"
override_manifest = ".agent/overrides.yaml"

[mcp.playwright]
endpoint = "http://caddy"
login_path = "/login"
network = "leedevkit-dev_dev_frontend"
viewports = "config/ui-viewports.json"
accounts_doc = "docs/dev-accounts.md"
startup_timeout = 15
request_timeout = 45
session_idle_timeout = 300

[addons]
skills = [
    { url = "https://github.com/addyosmani/agent-skills.git", version = "main" },
]
