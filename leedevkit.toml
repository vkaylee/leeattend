[devkit]
version = "0.7.27"
install = "per-project"
source = "release"

[project]
name = "LeeAttend"
namespace = "leeattend"
languages = ["rust", "typescript", "go"]

[services.apiserver]
dockerfile = "./apiserver"
lang = "rust"
ports = [3000]
health_check = "/api/v1/health"
cargo = true

[services.agent-main]
dockerfile = "./agent-main"
lang = "rust"
cargo = true

[services.webdashboard]
dockerfile = "./webdashboard"
lang = "typescript"
ports = [5173]
bun = true

[services.api-go]
dockerfile = "./apiserver"
lang = "go"
workdir = "apiserver"
ports = [3001]
health_check = "/health"
go = true

[targets]
api = ["apiserver", "agent-main"]
web = ["webdashboard"]
api-go = ["api-go"]
all = ["apiserver", "agent-main", "webdashboard", "api-go"]

[test.dependencies]
lint-go = ["api-go"]
unit-go = ["api-go"]
int-go = ["api-go"]

[ai]
rules_dir = ".attendagent/rules"
override_manifest = ".attendagent/overrides.yaml"

[addons]
skills = [
    { url = "https://github.com/addyosmani/agent-skills.git", version = "main" },
]
