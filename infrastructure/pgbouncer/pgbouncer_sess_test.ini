[databases]
* = host=db_system port=5432 pool_mode=session

[pgbouncer]
logfile = /tmp/pgbouncer_sess.log
pidfile = /tmp/pgbouncer_sess.pid
listen_addr = *
listen_port = 5452
auth_type = trust
auth_file = /etc/pgbouncer/userlist.txt
admin_users = test_user, tenant_test_user

# Global pooling configuration
pool_mode = session
max_client_conn = 1000
default_pool_size = 50
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 5
