[databases]
* = host=db_system port=5432 pool_mode=transaction

[pgbouncer]
logfile = /tmp/pgbouncer_tx.log
pidfile = /tmp/pgbouncer_tx.pid
listen_addr = *
listen_port = 6543
auth_type = trust
auth_file = /etc/pgbouncer/userlist.txt
admin_users = test_user, tenant_test_user

# Global pooling configuration
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 50
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 5

# Prepared statements support in transaction mode
max_prepared_statements = 250
