[databases]
leeattend = host=db_system port=5432 pool_mode=transaction
* = host=db_workspace port=5432 pool_mode=transaction

[pgbouncer]
logfile = /tmp/pgbouncer_tx.log
pidfile = /tmp/pgbouncer_tx.pid
listen_addr = *
listen_port = 6543
auth_type = trust
auth_file = /etc/pgbouncer/userlist.txt
admin_users = tenant_user, postgres

# Global pooling configuration
pool_mode = transaction
max_client_conn = 2000
default_pool_size = 50
min_pool_size = 10
reserve_pool_size = 5
reserve_pool_timeout = 5

# Prepared statements support in transaction mode
max_prepared_statements = 250
