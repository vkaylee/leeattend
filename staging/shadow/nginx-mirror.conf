# Nginx Shadow Traffic Mirroring Configuration (P8-02)
# Primary: Rust API Server (Port 3000)
# Shadow:  Go API Server   (Port 3001)

events {
    worker_connections 2048;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Upstream Definitions
    upstream rust_primary {
        server apiserver:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream go_shadow {
        server api-go:3001 max_fails=5 fail_timeout=10s;
        keepalive 32;
    }

    # Logging format capturing latency, status, and request correlation IDs
    log_format shadow_log '$remote_addr - $remote_user [$time_local] '
                          '"$request" $status $body_bytes_sent '
                          '"$http_referer" "$http_user_agent" '
                          'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time" '
                          'req_id="$http_x_request_id"';

    access_log /var/log/nginx/access.log shadow_log;
    error_log  /var/log/nginx/error.log warn;

    server {
        listen 80;
        server_name localhost;

        # Health endpoint
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # API Endpoints with Traffic Shadowing
        location /api/ {
            # Asynchronous traffic mirroring to Go shadow upstream
            mirror /mirror_api;
            mirror_request_body on;

            # Primary proxy to Rust baseline
            proxy_pass http://rust_primary;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $http_x_request_id;
            proxy_next_upstream error timeout http_502 http_503 http_504;

            proxy_connect_timeout 5s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;
        }

        # Internal Mirror Location for Go Candidate
        location = /mirror_api {
            internal;
            proxy_pass http://go_shadow$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Shadow-Traffic "true";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Request-ID $http_x_request_id;

            # Ignore client aborts and isolate shadow failures from primary
            proxy_ignore_client_abort on;
            proxy_connect_timeout 3s;
            proxy_send_timeout 5s;
            proxy_read_timeout 5s;
        }

        # Frontend Webdashboard
        location / {
            proxy_pass http://webdashboard:80;
            proxy_set_header Host $host;
        }
    }
}
