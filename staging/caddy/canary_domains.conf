# Domain Cutover Configuration — Phase 9 Production Cutover Complete
# All domains routed to Go API Server (api-go:3001)

# [Domain: System & Health]
handle /api/v1/system/* {
    reverse_proxy api-go:3001
}

# [Domain: Auth]
handle /api/v1/auth/* {
    reverse_proxy api-go:3001
}

# [Domain: Workspaces & RBAC]
handle /api/v1/workspaces/* {
    reverse_proxy api-go:3001
}

# [Domain: Employees]
handle /api/v1/employees/* {
    reverse_proxy api-go:3001
}

# [Domain: Shifts & Schedules]
handle /api/v1/shifts/* {
    reverse_proxy api-go:3001
}

# [Domain: Attendance & Logs]
handle /api/v1/attendance/* {
    reverse_proxy api-go:3001
}

# [Domain: Leaves]
handle /api/v1/leaves/* {
    reverse_proxy api-go:3001
}

# [Domain: Payroll]
handle /api/v1/payroll/* {
    reverse_proxy api-go:3001
}

# [Domain: Files & Storage]
handle /api/v1/files/* {
    reverse_proxy api-go:3001
}
