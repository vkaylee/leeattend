# Prometheus Staging Scrape Configuration (P8-06)
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "/etc/prometheus/alerts/*.yml"

scrape_configs:
  # Go API Server candidate metrics
  - job_name: "go-apiserver"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api-go:3001"]
        labels:
          service: "api-go"
          runtime: "go"
          env: "staging"

  # Rust API Server baseline metrics
  - job_name: "rust-apiserver"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["apiserver:3000"]
        labels:
          service: "apiserver-rust"
          runtime: "rust"
          env: "staging"

  # Go HTTP readiness probe probe-check
  - job_name: "go-readiness"
    metrics_path: "/probe"
    params:
      module: ["http_2xx"]
    static_configs:
      - targets: ["http://api-go:3001/api/v1/health/ready"]

  # Caddy proxy metrics (traffic routing, upstream status, request rates)
  - job_name: "caddy"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["caddy:2019"]
        labels:
          component: "gateway"

  # PgBouncer transaction pooler metrics
  - job_name: "pgbouncer-tx"
    static_configs:
      - targets: ["pgbouncer_tx:6543"]
        labels:
          pool_mode: "transaction"
