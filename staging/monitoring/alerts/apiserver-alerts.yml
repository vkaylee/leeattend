# Prometheus Alert Rules for Go API Server & Staging Canary (P8-06)
groups:
  - name: apiserver_canary_alerts
    rules:
      # ── Critical: Service Availability & Crash ──
      - alert: GoApiserverDown
        expr: up{service="api-go"} == 0
        for: 30s
        labels:
          severity: critical
          component: apiserver-go
        annotations:
          summary: "Go API Server instance down in staging"
          description: "Service api-go:3001 has been unreachable for >30s. Automated rollback recommended."

      # ── Critical: Readiness Probe Failure ──
      - alert: GoApiserverReadinessFailing
        expr: probe_success{job="go-readiness"} == 0
        for: 15s
        labels:
          severity: critical
          component: apiserver-go
        annotations:
          summary: "Go API Server readiness probe failing"
          description: "GET /api/v1/health/ready returned unhealthy status for 15s. DB or Redis dependency degraded."

      # ── Critical: Error Budget Burn / High 5xx Rate ──
      - alert: GoApiserverHigh5xxRate
        expr: |
          (sum(rate(http_requests_total{status=~"5.."}[1m])) 
           / 
           sum(rate(http_requests_total[1m]))) * 100 > 0.5
        for: 1m
        labels:
          severity: critical
          component: apiserver-go
        annotations:
          summary: "Go API Server 5xx error rate exceeds 0.5% threshold"
          description: "5xx error rate is {{ $value }}% over 1m window, exceeding 0.5% error budget threshold. Immediate rollback required."

      # ── Warning: Latency Spike ──
      - alert: GoApiserverHighLatencyP99
        expr: histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{service="api-go"}[2m])) by (le)) > 0.100
        for: 2m
        labels:
          severity: warning
          component: apiserver-go
        annotations:
          summary: "Go API Server p99 latency exceeds 100ms"
          description: "Measured p99 latency is {{ $value }}s over 2m window (SLA: <100ms)."

      # ── Warning: Database Pool Saturation ──
      - alert: GoApiserverDBPoolSaturation
        expr: (db_pool_active_connections{service="api-go"} / db_pool_max_connections{service="api-go"}) > 0.85
        for: 1m
        labels:
          severity: warning
          component: apiserver-go
        annotations:
          summary: "Go database connection pool utilization > 85%"
          description: "Active connections reached {{ $value }}% of pool limit. Risk of connection starvation."

      # ── Warning: Memory Bound Saturation ──
      - alert: GoApiserverMemoryApproachingLimit
        expr: container_memory_working_set_bytes{container="leeattend-staging-apiserver-go"} > 891289600 # 850MB
        for: 2m
        labels:
          severity: warning
          component: apiserver-go
        annotations:
          summary: "Go container memory usage approaching 1GB ceiling"
          description: "Memory working set is {{ $value }} bytes (>850MB). GOMEMLIMIT=768MiB active."

      # ── Critical: Audit Logging Persistence Failure ──
      - alert: GoApiserverAuditLogFailure
        expr: rate(audit_log_write_errors_total{service="api-go"}[1m]) > 0
        for: 30s
        labels:
          severity: critical
          component: apiserver-go
        annotations:
          summary: "Audit log persistence failing in Go API Server"
          description: "Audit trail writes are encountering persistence errors. Compliance breach."
