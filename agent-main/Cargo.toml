[package]
name = "agent"
version = "0.1.0"
edition = "2024"
description = "Multi-brand Attendance Agent Orchestrator"
license = "MIT"
repository = "https://github.com/anomalyco/leeattend"
readme = "README.md"
keywords = ["hrm", "attendance", "agent", "zkteco"]
categories = ["command-line-utilities"]

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
url = "2.5"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.9"
rustzk = "0.4.10"

log = "0.4"
env_logger = "0.11"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3.31"
rand = "0.8"
dashmap = "6"
rustc-hash = "2"
async-trait = "0.1"
redb = "3"
parking_lot = "0.12"
bincode = "1"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.10"
libc = "0.2"
