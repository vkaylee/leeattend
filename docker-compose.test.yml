# ==============================================================================
# Podman Compose — Test Environment
# ==============================================================================
# Used by: ./run-tests.sh (primary) and ./setup-test-env.sh
# Override:  docker-compose.ci.yml (applied only when CI=true)
#
# ARCHITECTURE:
#   - Containers stay idle (tail -f /dev/null) and tests are exec'd into them
#   - Source code is bind-mounted from host (.:/workspace) for live iteration
#   - Cargo registry is shared with host (~/.cargo/registry) to avoid re-downloads
#   - Target artifacts use persistent named volumes (survives restarts, cleared with down -v)
#   - PostgreSQL runs entirely in RAM (tmpfs + fsync=off) for maximum test speed
#
# IMPORTANT — Compile-time SQL validation:
#   All Rust compilation requires a live, migrated database because sqlx macros
#   verify queries at compile time. run-tests.sh calls ensure_db_migrated()
#   before any lint/unit/compile phase.
# ==============================================================================

services:

  # --- Test Database ---
  # Runs entirely in RAM for speed. Data is disposable (recreated each session).
  # fsync=off + synchronous_commit=off eliminate disk I/O entirely.
  test_db:
    image: docker.io/library/postgres:16
    command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off -c max_connections=200
    environment:
      POSTGRES_DB: test_database
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_HOST_AUTH_METHOD: trust  # No password needed inside test network
    healthcheck:
      test: "pg_isready -U test_user -d test_database"
      interval: 5s
      timeout: 5s
      retries: 5
    tmpfs:
      - /var/lib/postgresql/data:size=3072M  # 3GB RAM disk for DB data

  # --- API Server Test Container ---
  # Builds from Dockerfile "test" stage (includes cargo-chef pre-cooked deps, sqlx-cli, nextest).
  # Stays idle; run-tests.sh exec's cargo clippy / cargo nextest into it.
  apiserver_test:
    image: localhost/leeattend-test_apiserver_test
    build:
      context: ./apiserver
      target: test  # Dockerfile stage with test tools + pre-compiled deps
    depends_on:
      test_db:
        condition: service_healthy
    tty: true
    entrypoint: tail -f /dev/null  # Stay idle, tests are exec'd in
    working_dir: /workspace/apiserver
    environment:
      - DATABASE_URL=postgres://test_user:test_password@test_db:5432/test_database
      - CARGO_TARGET_DIR=/workspace/target  # Shared target across apiserver + agent
      - CARGO_BUILD_JOBS=4
      - SCCACHE_DIR=/workspace/.sccache     # Compile cache to avoid redundant recompilation
      - RUSTC_WRAPPER=sccache
    tmpfs:
      - /workspace/target/nextest
      - /workspace/target/debug/incremental
    volumes:
      - .:/workspace                        # Bind-mount source code from host
      - target-cache:/workspace/target      # Persistent: compiled artifacts survive restarts
      # Share host's cargo registry — avoids re-downloading crates and benefits
      - ${HOME}/.cargo/registry:/usr/local/cargo/registry
      - sccache-cache:/workspace/.sccache   # Persistent: sccache objects
      - shared-data:/workspace/shared       # Ephemeral: for inter-container data (e.g. openapi.json)

  # --- Agent Test Container ---
  # Same architecture as apiserver_test. Uses SQLite in-memory for its own DB.
  # Shares the same target-cache and cargo registry as apiserver_test.
  agent_test:
    image: localhost/leeattend-test_agent_test
    build:
      context: ./agent-main
      target: test
    depends_on:
      - apiserver_test
    tty: true
    entrypoint: tail -f /dev/null
    working_dir: /workspace/agent-main
    environment:
      - "DATABASE_URL=:memory:"  # Agent uses Redb, in-memory for tests
      - "CENTRAL_SERVER_URL=ws://apiserver_test:3001/api/ws"
      - CARGO_TARGET_DIR=/workspace/target  # Shared with apiserver_test
      - CARGO_BUILD_JOBS=4
      - SCCACHE_DIR=/workspace/.sccache
      - RUSTC_WRAPPER=sccache
    tmpfs:
      - /workspace/target/nextest
      - /workspace/target/debug/incremental
    volumes:
      - .:/workspace
      - target-cache:/workspace/target
      - ${HOME}/.cargo/registry:/usr/local/cargo/registry
      - sccache-cache:/workspace/.sccache

  # --- Web Dashboard Test Container ---
  # Builds from webdashboard Dockerfile "test" stage (includes Playwright + Chromium).
  # node_modules use a persistent named volume to avoid re-installing on each run.
  web_test:
    image: localhost/leeattend-test_web_test
    build:
      context: ./webdashboard
      target: test  # Dockerfile stage with Playwright + browser deps
    tty: true
    entrypoint: tail -f /dev/null
    working_dir: /workspace/webdashboard
    environment:
      - CI=true                             # Tells tools to run in non-interactive mode
      - npm_config_cache=/workspace/.npm-cache
    tmpfs:
      - /workspace/webdashboard/test-results:size=128M   # Playwright output — disposable
      - /workspace/webdashboard/playwright-report:size=64M
    volumes:
      - .:/workspace
      - web-node-modules:/workspace/webdashboard/node_modules  # Persistent npm packages
      - shared-data:/workspace/shared
      - npm-cache:/workspace/.npm-cache     # Persistent npm download cache

# ==============================================================================
# Volume Strategy:
#   - Named volumes (persistent): survive "podman-compose down", cleared with "down -v"
#     → Use for compilation artifacts that are expensive to recreate
#   - tmpfs (ephemeral): RAM-only, lost on container stop
#     → Use only for small, truly disposable data
#   - Bind-mount (host-shared): ~/.cargo/registry
#     → Shared across host and containers, benefits all Rust projects
# ==============================================================================
volumes:
  target-cache:           # Rust compiled artifacts (~3-4GB). Persistent on disk — survives restarts.
    driver: local
  sccache-cache:          # sccache compilation cache. Shared across apiserver + agent.
    driver: local
  npm-cache:              # NPM download cache. Avoids re-downloading packages.
    driver: local
  web-node-modules:       # node_modules for webdashboard. Avoids re-install on each run.
    driver: local
  shared-data:            # Small ephemeral data for inter-container communication.
    driver: local
    driver_opts: { type: tmpfs, device: tmpfs, o: "size=64M" }
