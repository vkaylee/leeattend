services:
  test_db:
    image: postgres:16
    command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off -c max_connections=200
    environment:
      POSTGRES_DB: test_database
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d test_database"]
      interval: 5s
      timeout: 5s
      retries: 5
    tmpfs: 
      - /var/lib/postgresql/data

  apiserver_test:
    build:
      context: ./apiserver
      dockerfile: Dockerfile.test
    depends_on:
      test_db:
        condition: service_healthy
    tty: true
    entrypoint: tail -f /dev/null
    working_dir: /workspace/apiserver
    environment:
      - DATABASE_URL=postgres://test_user:test_password@test_db:5432/test_database
      - RUST_LOG=info
      - SQLX_OFFLINE=true
      - SCCACHE_DIR=/sccache
      - RUSTC_WRAPPER=sccache
      - CARGO_INCREMENTAL=0
    volumes:
      - ${PWD}/apiserver:/workspace/apiserver
      - apiserver-target:/workspace/apiserver/target
      - sccache-storage:/sccache
      - test-logs:/workspace/apiserver/.test_logs
      - shared-data:/workspace/shared

  agent_test:
    build:
      context: ./agent-main
      dockerfile: Dockerfile.test
    tty: true
    entrypoint: tail -f /dev/null
    working_dir: /workspace/agent-main
    environment:
      - "DATABASE_URL=sqlite::memory:"
      - "CENTRAL_SERVER_URL=ws://apiserver_test:3001/api/ws"
      - RUST_LOG=info
      - SCCACHE_DIR=/sccache
      - RUSTC_WRAPPER=sccache
      - CARGO_INCREMENTAL=0
    volumes:
      - ${PWD}/agent-main:/workspace/agent-main
      - ${PWD}/agent-zk-worker:/workspace/agent-zk-worker
      - agent-target:/workspace/agent-main/target
      - sccache-storage:/sccache
      - test-logs:/workspace/agent-main/.test_logs

  web_test:
    build:
      context: ./webdashboard
      dockerfile: Dockerfile.test
    tty: true
    entrypoint: tail -f /dev/null
    working_dir: /workspace/webdashboard
    environment:
      - CI=true
    volumes:
      - ${PWD}/webdashboard:/workspace/webdashboard
      - /workspace/webdashboard/node_modules
      - test-logs:/workspace/webdashboard/.test_logs
      - shared-data:/workspace/shared

volumes:
  apiserver-target:
  agent-target:
  sccache-storage:
  shared-data:
  test-logs:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=128m"
