[package]
name = "apiserver"
version = "0.1.0"
edition = "2021"
description = "HRM Attendance API Server"
license = "MIT"
repository = "https://github.com/anomalyco/leeattend"
readme = "README.md"
keywords = ["hrm", "attendance", "api", "rest"]
categories = ["web-programming"]

[dependencies]
axum = { version = "0.7", features = ["macros", "multipart", "ws"] }
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = { version = "0.3.31", features = ["sink"] }
bigdecimal = { version = "0.4.5", features = ["serde"] }
uuid = { version = "1.19.0", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4.42", features = ["serde"] }
chrono-tz = "0.9"
sqlx = { version = "0.8.6", features = ["runtime-tokio-native-tls", "postgres", "chrono", "uuid", "macros", "json", "migrate", "rust_decimal"] }
diesel = { version = "2.1", features = ["postgres", "chrono", "uuid", "serde_json", "numeric"] }
diesel-async = { version = "0.4.1", features = ["postgres", "deadpool", "tokio"] }
tower-http = { version = "0.6.8", features = ["cors", "trace"] }
async-trait = "0.1.89"
jsonwebtoken = { version = "10.2.0", features = ["rust_crypto"] }
bcrypt = "0.17.1"
json-patch = "0.3.0"
rust_decimal = { version = "1.32.0", features = ["serde", "db-diesel2-postgres"] }
calamine = { version = "0.32.0", features = ["dates"] }
csv = "1.4.0"
strum = "0.26"
strum_macros = "0.26"
sha2 = "0.10"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
tokio-stream = { version = "0.1", features = ["time"] }
tokio-util = { version = "0.7", features = ["rt"] }
rust_xlsxwriter = "0.79"
base64 = "0.22.1"
moka = { version = "0.12", features = ["future"] }
utoipa = { version = "5.0", features = ["axum_extras", "chrono", "uuid", "decimal"] }
utoipa-axum = "0.2"
thiserror = "2.0.18"
tower = { version = "0.5.2", features = ["util"] }
mimalloc = { version = "0.1", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

[lints]
workspace = true

[dev-dependencies]
mockall = "0.13"
http = "1.4.0"
http-body-util = "0.1"
serial_test = "3.3.1"
tempfile = "3.24.0"
tokio-test = "0.4.5"
tokio-tungstenite = { version = "0.26.2", features = ["rustls-tls-webpki-roots"] }

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[[test]]
name = "e2e"
path = "tests/e2e/main.rs"
