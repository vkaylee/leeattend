[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = [
    # "-C", "link-arg=-fuse-ld=mold",
    # "-C", "link-arg=-Wl,--compress-debug-sections=zstd",
    # "-C", "link-arg=-Wl,--threads",
]

[build]
# Limit parallel jobs to prevent system hanging on WSL
jobs = 4

[profile.dev]
# Accelerate linking by not packing debug info into the binary
split-debuginfo = "unpacked"
debug = 1

[profile.release]
# Optimized for production with balanced build time
lto = "thin"
codegen-units = 16
panic = "abort"