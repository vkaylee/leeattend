# Bacon configuration for LeeAttend APIServer

[jobs.check]
command = ["cargo", "check", "--color", "always"]
need_stdout = false

[jobs.check-all]
command = ["cargo", "check", "--all-targets", "--color", "always"]
need_stdout = false

[jobs.test]
command = ["cargo", "test", "--color", "always"]
need_stdout = true

[jobs.run]
command = [
    "cargo", "run",
    "--color", "always",
    # Add other arguments if needed
]
need_stdout = true
allow_warnings = true
on_change_strategy = "kill_then_restart"

[jobs.run-with-port-ignore]
command = [
    "cargo", "run",
    "--color", "always",
]
need_stdout = true
allow_warnings = true
# This matches your requirement to ignore .api_port and focus on src
watch = ["src", "Cargo.toml", "migrations"]
ignore = [".api_port", "target", ".git"]
on_change_strategy = "kill_then_restart"

# Default job is 'check'
default_job = "check"
