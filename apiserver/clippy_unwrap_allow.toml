# clippy_unwrap_allow.toml — Baseline allow-list for .unwrap() / .expect()
#
# This file tracks the CURRENT count of .unwrap() and .expect() calls
# in PRODUCTION source code (correctly excluding #[cfg(test)] blocks).
#
# CI uses this to:
#   - FAIL if a NEW file adds .unwrap()/.expect()
#   - FAIL if an existing file INCREASES its count
#   - PASS if counts stay the same or decrease
#
# NOTE: The codebase is already clean on .unwrap() — the crate-level
# #![deny(clippy::unwrap_used, clippy::expect_used)] in lib.rs is effective.
# The remaining entries are either:
#   - Unreachable chrono construction (compliance_validation_service.rs)
#   - Standalone CLI utility (gen_hash.rs)
#   - Test-only files gated at module level (test_utils.rs)
#
# Generated: 2026-07-24 (CORRECTED — using count_unwrap.py)
# Previous baseline was inflated by ~970 false positives from grep
# miscounting #[cfg(test)] code as production.

[unwrap]
"worker/test_utils.rs" = 2

[expect]
"services/compliance_validation_service.rs" = 6
"gen_hash.rs" = 1
