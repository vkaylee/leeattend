server {
    listen 80;
    server_name localhost;

    # Performance optimizations
    client_max_body_size 10M; # allow larger payloads (e.g. batch attendance)
    keepalive_timeout 65;
    sendfile on;

    # Frontend (Vite dev server with HMR)
    location / {
        proxy_pass http://webdashboard:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Proxy API requests to backend
    location /api {
        proxy_pass http://apiserver:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Proxy WebSocket requests
    location /api/ws {
        proxy_pass http://apiserver:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        
        # WebSocket optimization (prevent disconnects)
        proxy_read_timeout 3600s;     # 1 hour timeout for idle WS
        proxy_send_timeout 3600s; 
        proxy_buffering off;          # Send data immediately
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
