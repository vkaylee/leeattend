[profile.default]
# ==============================================================================
# Retries
# ==============================================================================
# Automatically retry failing tests up to 2 times to mitigate flaky tests.
retries = 2

# ==============================================================================
# Timeouts & Hanging Test Prevention
# ==============================================================================
# Tests taking longer than 120 seconds (period * terminate-after) will be killed.
# This strictly enforces that no single test can hang and block the environment.
slow-timeout = { period = "30s", terminate-after = 4 }

# ==============================================================================
# Leak Detection
# ==============================================================================
# Warn if background threads or child processes are left running after the test
# finishes. Wait up to 100ms before warning.
leak-timeout = "100ms"

[profile.ci]
# Override default settings for CI
retries = { backoff = "exponential", count = 3, delay = "1s", max-delay = "10s" }
slow-timeout = { period = "30s", terminate-after = 2 }
