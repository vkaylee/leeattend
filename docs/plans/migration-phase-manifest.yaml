# Fresh-install migration phase manifest.
# Historical numeric migrations remain schema oracle until catalog comparison passes.
# This file is planning metadata; runner must not consume it yet.

version: 1
mode: fresh-install-only
order:
  - foundation
  - hr_core
  - attendance_schedule
  - payroll
  - runtime_seeds

phases:
  foundation:
    order: 10
    depends_on: []
    owns:
      - extensions
      - shared_types_and_functions
      - schema_migrations
      - organization_auth_and_audit
      - common_hr_entities
      - common_attendance_schedule_payroll_tables
      - final_config_entries_constraints
      - shared_indexes_foreign_keys_partitions
    source_of_truth:
      - apiserver/migrations/20261110000000_single_organization_baseline
      - apiserver/migrations/20261112000000_config_entries_integrity
    fresh_policy:
      - omit_existing_data_duplicate_cleanup
      - omit_retired_salary_base_tables
      - encode_final_schema_directly

  hr_core:
    order: 20
    depends_on:
      - foundation
    owns:
      - employment_relationships
      - employment_relationship_validators_and_triggers
      - employee_tenures
      - employee_tenure_reconciliation
      - employment_relationship_tenure_link
    source_of_truth:
      - apiserver/migrations/20261112010000_employment_relationships
      - apiserver/migrations/20261112020000_employment_relationship_backfill
      - apiserver/migrations/20261115030000_employee_tenures
    fresh_policy:
      - omit_relationship_backfill_dml
      - omit_existing_employee_reconciliation_insert
      - preserve_final_constraints_and_indexes

  attendance_schedule:
    order: 30
    depends_on:
      - foundation
      - hr_core
    owns:
      - payroll_periods
      - schedule_lifecycle
      - attendance_closures
      - schedule_activation_constraints
      - schedule_provenance_and_reconciliation
      - schedule_office_policies
      - legacy_schedule_mutation_guards
      - official_shift_swap_revision_links
      - schedule_day_and_utc_offsets
    source_of_truth:
      - apiserver/migrations/20261112030000_payroll_periods
      - apiserver/migrations/20261113000000_schedule_lifecycle
      - apiserver/migrations/20261114030000_schedule_activation_ranges
      - apiserver/migrations/20261114040000_schedule_legacy_backfill
      - apiserver/migrations/20261114050000_schedule_shadow_reconciliation
      - apiserver/migrations/20261114070000_schedule_legacy_mutation_evidence
      - apiserver/migrations/20261114100000_schedule_office_policies
      - apiserver/migrations/20261115000000_schedule_legacy_mutation_guards
      - apiserver/migrations/20261116000000_atomic_official_shift_swaps
      - apiserver/migrations/20261117000000_schedule_day_offsets
    fresh_policy:
      - omit_legacy_schedule_backfill_dml
      - retain_provenance_state_and_evidence_tables
      - preserve_runtime_guards_and_views_if_any

  payroll:
    order: 40
    depends_on:
      - foundation
      - hr_core
      - attendance_schedule
    owns:
      - payroll_input_registry
      - payroll_formula_versions_and_calculation_runs
      - payroll_run_links
      - payroll_idempotency_constraints
      - payroll_input_governance
      - labor_policy_groups
      - payroll_policy_snapshots
      - payslip_policy_links
      - pay_basis_rate_components
      - department_payroll_reconciliation_view
    source_of_truth:
      - apiserver/migrations/20261113030000_payroll_input_registry
      - apiserver/migrations/20261113040000_payroll_formula_versions
      - apiserver/migrations/20261113050000_payroll_calculation_run_links
      - apiserver/migrations/20261114010000_payroll_calculation_run_idempotency
      - apiserver/migrations/20261114020000_payroll_input_row_governance
      - apiserver/migrations/20261114080000_labor_policy_groups
      - apiserver/migrations/20261114090000_payroll_calculation_run_policy_snapshot
      - apiserver/migrations/20261114110000_payroll_segment_policy_snapshots
      - apiserver/migrations/20261115010000_department_payroll_reconciliation
      - apiserver/migrations/20261115020000_pay_basis_rate_components
      - apiserver/migrations/20261115050000_append_only_payroll_policy_snapshots
    fresh_policy:
      - move_metric_seed_rows_to_runtime_seeds
      - encode_final_index_state_directly
      - omit_superseded_policy_snapshot_index
      - preserve_reconciliation_view

  runtime_seeds:
    order: 50
    depends_on:
      - foundation
      - payroll
    owns:
      - feature_flag_defaults
      - payroll_metric_defaults
      - organization_payroll_policy_defaults
      - post_bootstrap_formula_defaults
      - ess_feature_flag_default
    source_of_truth:
      - apiserver/migrations/20261113010000_feature_flags_runtime
      - apiserver/migrations/20261113030000_payroll_input_registry
      - apiserver/migrations/20261114000000_payroll_policy_parameters
      - apiserver/migrations/20261114060000_payroll_kpi_formula_seed
      - apiserver/migrations/20261115040000_ess_feature_flag
    fresh_policy:
      - all_seeds_idempotent
      - no_current_date_dependent_seed_identity
      - formula_seed_runs_after_admin_bootstrap
      - fail_if_required_post_bootstrap_owner_is_missing

excluded_from_fresh_chain:
  - migration: apiserver/migrations/20261112020000_employment_relationship_backfill
    reason: existing_data_backfill
  - migration: apiserver/migrations/20261114040000_schedule_legacy_backfill
    reason: existing_data_backfill
  - migration: apiserver/migrations/20261113020000_retire_salary_base_groups
    reason: destructive_upgrade_cleanup; final schema omits retired tables

verification:
  catalog_oracle: current_numeric_migration_chain_on_disposable_database
  compare:
    - tables
    - columns_and_types
    - nullability_defaults
    - primary_foreign_unique_check_and_exclusion_constraints
    - indexes
    - functions_and_triggers
    - views
    - extensions
  failure_cases:
    - phase_sql_error_rolls_back_objects_and_marker
    - rerun_is_idempotent
    - stale_marker_is_rejected
    - missing_required_object_is_rejected
    - formula_seed_without_bootstrap_owner_fails
