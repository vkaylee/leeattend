services:
  db:
    command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off -c max_connections=200
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev_password}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  apiserver:
    build:
      target: dev
    command: cargo watch -w src -x run
    environment:
      - RUST_BACKTRACE=1
      - DATABASE_URL=${API_DATABASE_URL:-postgres://${DB_USER:-admin}:${DB_PASSWORD:-dev_password}@db:5432/${DB_NAME:-leeattend}}
      - RUST_LOG=apiserver=debug,tower_http=debug,sqlx=info
      - SQLX_OFFLINE=false
    volumes:
      - ./apiserver:/app
      - cargo-registry:/usr/local/cargo/registry
      - apiserver-target:/app/target
      - ./apiserver/storage:/app/storage

  agent-main:
    build:
      target: dev
    command: cargo watch -w src -x run
    environment:
      - DATABASE_URL=${AGENT_DATABASE_URL:-sqlite:///app/data/agent.db?mode=rwc}
      - RUST_LOG=info,sqlx::query=error
    volumes:
      - ./agent-main:/app
      - cargo-registry:/usr/local/cargo/registry
      - agent-target:/app/target
      - agent_dev_data:/app/data

  webdashboard:
    build:
      target: dev
    environment:
      - VITE_API_BASE_URL=/api
      - VITE_API_URL=http://apiserver:3000
    volumes:
      - ./webdashboard:/app
      - webdashboard-node-modules:/app/node_modules

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - apiserver
      - webdashboard
    ports:
      - "${DEV_PORT:-8080}:80"
    volumes:
      - ./nginx-dev.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_dev_data:
  agent_dev_data:
  apiserver-target:
  agent-target:
  cargo-registry:
  webdashboard-node-modules:
