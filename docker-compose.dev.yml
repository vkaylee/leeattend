services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off -c max_connections=200
    environment:
      POSTGRES_DB: ${DB_NAME:-leeattend}
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev_password}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d ${DB_NAME:-leeattend}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  apiserver:
    build:
      context: ./apiserver
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      bash -c "
        cargo watch -w src -x run
      "
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=3000
      - DATABASE_URL=postgres://${DB_USER:-admin}:${DB_PASSWORD:-dev_password}@db:5432/${DB_NAME:-leeattend}
      - REDIS_URL=redis://redis:6379
      - WORKER_MAX_CONCURRENT=4
      - ALLOWED_ORIGINS=http://localhost:3000,https://tauri.localhost,http://localhost:3001
      - RUST_LOG=apiserver=debug,tower_http=debug,sqlx=info
      - JWT_SECRET=${JWT_SECRET:-dev_jwt_secret}
      - AGENT_LOG_FLUSH_MS=100
      - AGENT_LOG_BATCH_SIZE=100
      - AGENT_LOG_BUFFER_CAPACITY=1000
      - SQLX_OFFLINE=true
    volumes:
      - ./apiserver:/app
      - cargo-registry:/usr/local/cargo/registry
      - apiserver-target:/app/target
      - ./apiserver/storage:/app/storage
    expose:
      - "3000"

  agent-main:
    build:
      context: ./agent-main
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    working_dir: /app
    depends_on:
      - apiserver
    command: >
      bash -c "
        cargo watch -w src -x run
      "
    environment:
      - CENTRAL_SERVER_URL=ws://apiserver:3000/api/ws
      - RPC_TIMEOUT_SECONDS=300
      - DATABASE_URL=sqlite:///app/data/agent.db?mode=rwc
      - RUST_LOG=info,sqlx::query=error
    volumes:
      - ./agent-main:/app
      - cargo-registry:/usr/local/cargo/registry
      - agent-target:/app/target
      - agent_dev_data:/app/data

  webdashboard:
    image: node:20-slim
    restart: unless-stopped
    working_dir: /app
    depends_on:
      - apiserver
    command: >
      bash -c "
        npm install &&
        npm run dev -- --host 0.0.0.0
      "
    environment:
      - VITE_API_BASE_URL=/api
      - VITE_API_URL=http://apiserver:3000
      - VITE_DEV_SERVER_HOST=0.0.0.0
    volumes:
      - ./webdashboard:/app
      - webdashboard-node-modules:/app/node_modules
    expose:
      - "5173"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - apiserver
      - webdashboard
    ports:
      - "${DEV_PORT:-0}:80"
    volumes:
      - ./nginx-dev.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_dev_data:
  redis_dev_data:
  agent_dev_data:
  apiserver-target:
  agent-target:
  cargo-registry:
  webdashboard-node-modules:
