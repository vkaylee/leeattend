# ==============================================================================
# Podman Compose — Development (Hot Reload)
# ==============================================================================
# Full development environment with hot-reload for all services.
# Source code is bind-mounted so changes are reflected immediately.
#
# FEATURES:
#   - cargo watch for Rust services (auto-restart on save)
#   - Vite dev server for webdashboard (HMR)
#   - Nginx reverse proxy on port 8080
#   - Persistent volumes for cargo registry, target dirs, and DB data
#   - Postgres with fsync=off for faster local development
#   - RedisInsight UI on port 5540 for Redis debugging
#
# USAGE:
#   podman-compose -f docker-compose.dev.yml up
# ==============================================================================
services:
  db:
    image: docker.io/library/postgres:16-alpine
    command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off -c max_connections=200
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev_password}
    healthcheck:
      test: "pg_isready -U ${DB_USER:-postgres}"
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  redis:
    image: docker.io/library/redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-dev_password}
    healthcheck:
      test: [ "CMD", "sh", "-c", "redis-cli -a $${REDIS_PASSWORD:-dev_password} ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redisinsight:
    image: docker.io/redis/redisinsight:latest
    ports:
      - "5540:5540"
    environment:
      - RI_REDIS_HOST=redis
      - RI_REDIS_PORT=6379
      - RI_REDIS_PASSWORD=${REDIS_PASSWORD:-dev_password}
      - RI_REDIS_ALIAS=LeeAttend-Redis
    depends_on:
      redis:
        condition: service_healthy

  apiserver:
    image: localhost/leeattend_dev_apiserver
    build:
      context: ./apiserver
      dockerfile: Dockerfile
      target: dev
    command: cargo watch -w src -x run
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: "wget -qO- http://localhost:3000/api/health > /dev/null || exit 1"
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      # --- Core ---
      - RUST_BACKTRACE=1
      - RUST_LOG=apiserver=debug,tower_http=debug,sqlx=info
      - DATABASE_URL=${API_DATABASE_URL:-postgres://${DB_USER:-admin}:${DB_PASSWORD:-dev_password}@db:5432/${DB_NAME:-leeattend}}
      # - DATABASE_READER_URL=${DATABASE_READER_URL}
      - DB_API_MAX_CONN=${DB_API_MAX_CONN:-20}
      - DB_WORKER_MAX_CONN=${DB_WORKER_MAX_CONN:-5}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-dev_password}@redis:6379
      # --- Server ---
      - API_HOST=0.0.0.0
      - API_PORT=3000
      # --- Auth & Security ---
      - JWT_SECRET=${JWT_SECRET:-dev_secret_key_leeattend_2026}
      # - ALLOWED_ORIGINS=  # CORS origins, empty = allow all in dev
      # --- Agent Log Buffer ---
      # - AGENT_LOG_BUFFER_CAPACITY=5000
      # - AGENT_LOG_BATCH_SIZE=100
      # - AGENT_LOG_FLUSH_MS=1000
      # --- Report Worker ---
      - WORKER_MAX_CONCURRENT=6
      # - WORKER_POLL_TIMEOUT_SECS=30
      # - WORKER_MAX_RETRIES=3
      # - WORKER_JOB_TIMEOUT_SECS=300
    volumes:
      - ./apiserver:/app
      - cargo-registry:/usr/local/cargo/registry
      - apiserver-target:/app/target
      - ./apiserver/storage:/app/storage

  agent-main:
    image: localhost/leeattend_dev_agent-main
    build:
      context: ./agent-main
      dockerfile: Dockerfile
      target: dev
    command: cargo watch -w src -x run
    depends_on:
      apiserver:
        condition: service_healthy
    environment:
      # --- Core ---
      - RUST_LOG=info,sqlx::query=error
      - CENTRAL_SERVER_URL=${AGENT_CENTRAL_SERVER_URL:-ws://apiserver:3000/api/ws}
      - DATABASE_URL=${AGENT_DATABASE_URL:-sqlite:///app/data/agent.db?mode=rwc}
      - AGENT_ID=${AGENT_ID:-test-agent}
      - AGENT_TOKEN=${AGENT_TOKEN:-test-token}
      # --- Runtime Tuning (max_concurrent_workers is server-managed via ConfigPush) ---
      # - POLL_INTERVAL_SECONDS=300
      # - INFLIGHT_TIMEOUT_SECS=300
      # - SUCCESS_SKIP_POLLS=60
      # --- Memory Management ---
      - MAX_MEMORY_LOGS=${MAX_MEMORY_LOGS:-200000}
      # - SIGNATURE_TTL_DAYS=90
      # - SIGNATURE_CLEANUP_HOURS=24
    volumes:
      - ./agent-main:/app
      - cargo-registry:/usr/local/cargo/registry
      - agent-target:/app/target
      - agent_dev_data:/app/data

  webdashboard:
    image: localhost/leeattend_dev_webdashboard
    build:
      context: ./webdashboard
      target: dev
    environment:
      - VITE_API_URL=http://apiserver:3000/api
    volumes:
      - ./webdashboard:/app
      - webdashboard-node-modules:/app/node_modules

  nginx:
    image: docker.io/library/nginx:alpine
    restart: unless-stopped
    depends_on:
      apiserver:
        condition: service_healthy
      webdashboard:
        condition: service_started
    ports:
      - "${DEV_PORT:-8080}:80"
    volumes:
      - ./nginx-dev.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_dev_data:
  agent_dev_data:
  apiserver-target:
  agent-target:
  cargo-registry:
  webdashboard-node-modules:
