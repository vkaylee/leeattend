{
  "folders": {},
  "connections": {
    "pg_leeattend_dev": {
      "provider": "postgresql",
      "driver": "postgres-jdbc",
      "name": "LeeAttend Dev DB",
      "save-password": true,
      "read-only": false,
      "configuration": {
        "host": "pgbouncer",
        "port": "6432",
        "database": "${DB_NAME}",
        "url": "jdbc:postgresql://pgbouncer:6432/${DB_NAME}",
        "configurationType": "MANUAL",
        "type": "dev",
        "auth-model": "native",
        "user": "${DB_USER}",
        "password": "${DB_PASSWORD}",
        "properties": {
          "connectTimeout": "20",
          "loginTimeout": "20"
        },
        "provider-properties": {
          "@dbeaver-show-non-default-db@": "true",
          "show-non-default-db": "true"
        }
      }
    }
  },
  "connection-types": {
    "dev": {
      "name": "Development",
      "color": "255,255,255",
      "description": "Development database",
      "auto-commit": true,
      "confirm-execute": false,
      "confirm-data-change": false,
      "auto-close-transactions": true
    }
  }
}
