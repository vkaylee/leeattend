# ==============================================================================
# Podman Compose — Test Environment (Self-Contained)
# ==============================================================================
# This file is fully standalone — it does NOT merge with docker-compose.yml.
# Profiles isolate backend (db, redis, apiserver, agent) from frontend
# (webdashboard, bun_init) so phases that only need one side don't
# launch the other.

networks:
  test_net:
    driver: bridge

x-rust-test-base: &rust-test-base
  tty: true
  entrypoint: [ "sleep", "infinity" ]
  networks:
    - test_net
  environment:
    - CARGO_TARGET_DIR=/workspace/target
    - CARGO_BUILD_JOBS=1
    - SCCACHE_DIR=/workspace/.sccache
    - RUSTC_WRAPPER=sccache
  tmpfs:
    - /workspace/target/nextest
    - /workspace/target/debug/incremental
  volumes:
    - ${PROJECT_ROOT}:/workspace
    - target-cache:/workspace/target
    - ${HOME}/.cargo/registry:/usr/local/cargo/registry
    - sccache-cache:/workspace/.sccache
    - /dev/shm/leeattend-shared-data:/workspace/shared
    - /dev/shm/leeattend-sqlx-cache:/workspace/apiserver/.sqlx

services:
  db:
    image: public.ecr.aws/docker/library/postgres:16-alpine
    profiles:
      - infra-db
    networks:
      - test_net
    command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off -c max_connections=200
    environment:
      - POSTGRES_DB=test_database
      - POSTGRES_USER=test_user
      - POSTGRES_PASSWORD=test_password
      - POSTGRES_HOST_AUTH_METHOD=trust
    healthcheck:
      test: "pg_isready -U test_user -d test_database"
      interval: 5s
      timeout: 5s
      retries: 5
    tmpfs:
      - /var/lib/postgresql/data:size=3072M

  redis:
    image: public.ecr.aws/docker/library/redis:7-alpine
    profiles:
      - infra-redis
    networks:
      - test_net
    command: []
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  db_init:
    profiles:
      - infra-db
    <<: *rust-test-base
    image: localhost/leeattend-test_apiserver
    build:
      context: ..
      dockerfile: apiserver/Dockerfile
      target: test
    depends_on:
      db:
        condition: service_healthy
    working_dir: /workspace/apiserver
    environment:
      - DATABASE_URL=postgres://test_user:test_password@db:5432/test_database?sslmode=disable
    entrypoint:
      - bash
      - -c
      - |
        sqlx migrate run
        for i in {1..5}; do
          psql postgres://test_user:test_password@db:5432/postgres?sslmode=disable -c "CREATE DATABASE leeattend_test_template TEMPLATE test_database" && break
          echo "Retrying psql..."
          sleep 1
        done
        touch /tmp/db_init_done
        sleep infinity
    healthcheck:
      test: "test -f /tmp/db_init_done"
      interval: 2s
      timeout: 5s
      retries: 10

  apiserver:
    profiles:
      - lint-api
      - unit-api
      - int-api
      - api
    <<: *rust-test-base
    image: localhost/leeattend-test_apiserver
    build:
      context: ..
      dockerfile: apiserver/Dockerfile
      target: test
    depends_on:
      db_init:
        condition: service_healthy
      redis:
        condition: service_healthy
    working_dir: /workspace/apiserver
    environment:
      - DATABASE_URL=postgres://test_user:test_password@db:5432/test_database
      - REDIS_URL=redis://redis:6379
    healthcheck:
      test: "echo 'ready'"
      interval: 5s
      timeout: 5s
      retries: 5

  agent-main:
    profiles:
      - int-api
      - api
    <<: *rust-test-base
    image: localhost/leeattend-test_agent-main
    build:
      context: ..
      dockerfile: agent-main/Dockerfile
      target: test
    working_dir: /workspace/agent-main
    environment:
      - "DATABASE_URL=:memory:"
      - CENTRAL_SERVER_URL=ws://apiserver:3001/api/ws

  bun_init:
    profiles:
      - lint-web
      - unit-web
      - e2e-web
      - frontend
      - web
    image: localhost/leeattend-test_webdashboard
    build:
      context: ..
      dockerfile: webdashboard/Dockerfile
      target: test
    networks:
      - test_net
    working_dir: /workspace/webdashboard
    environment:
      - NODE_ENV=test
      - BUN_INSTALL_CACHE_DIR=/workspace/.bun-cache
    entrypoint:
      - sh
      - -c
      - |
        bun install
        touch /tmp/bun_init_done
        sleep infinity
    healthcheck:
      test: "test -f /tmp/bun_init_done"
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - ${PROJECT_ROOT}:/workspace
      - web-node-modules:/workspace/webdashboard/node_modules
      - bun-cache:/workspace/.bun-cache

  webdashboard:
    profiles:
      - lint-web
      - unit-web
      - e2e-web
      - frontend
      - web
    image: localhost/leeattend-test_webdashboard
    build:
      context: ..
      dockerfile: webdashboard/Dockerfile
      target: test
    tty: true
    depends_on:
      bun_init:
        condition: service_healthy
    networks:
      - test_net
    entrypoint: sleep infinity
    working_dir: /workspace/webdashboard
    environment:
      - NODE_ENV=test
      - CI=true
      - BUN_INSTALL_CACHE_DIR=/workspace/.bun-cache
    tmpfs:
      - /workspace/webdashboard/test-results:size=128M
      - /workspace/webdashboard/playwright-report:size=64M
    volumes:
      - ${PROJECT_ROOT}:/workspace
      - web-node-modules:/workspace/webdashboard/node_modules
      - /dev/shm/leeattend-shared-data:/workspace/shared
      - bun-cache:/workspace/.bun-cache

volumes:
  target-cache:
    name: leeattend-test_target-cache
    driver: local
  sccache-cache:
    name: leeattend-test_sccache-cache
    driver: local
  bun-cache:
    name: leeattend-test_bun-cache
    driver: local
  web-node-modules:
    name: leeattend-test_web-node-modules
    driver: local
