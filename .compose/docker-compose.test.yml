# ==============================================================================
# Podman Compose — Test Override
# ==============================================================================
# This file extends docker-compose.yml to provide the test environment.
# Services inherit from the base file but override images, networks, and volumes
# to isolate test data.

networks:
  test_net:
    driver: bridge

x-rust-test-base: &rust-test-base
  tty: true
  entrypoint: tail -f /dev/null
  networks:
    - test_net
  environment:
    - CARGO_TARGET_DIR=/workspace/target
    - CARGO_BUILD_JOBS=1
    - SCCACHE_DIR=/workspace/.sccache
    - RUSTC_WRAPPER=sccache
  tmpfs:
    - /workspace/target/nextest
    - /workspace/target/debug/incremental
  volumes:
    - ${PROJECT_ROOT}:/workspace
    - target-cache:/workspace/target
    - ${HOME}/.cargo/registry:/usr/local/cargo/registry
    - sccache-cache:/workspace/.sccache
    - shared-data:/workspace/shared

services:
  db:
    networks:
      - test_net
    command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off -c max_connections=200
    environment:
      - POSTGRES_DB=test_database
      - POSTGRES_USER=test_user
      - POSTGRES_PASSWORD=test_password
      - POSTGRES_HOST_AUTH_METHOD=trust
    healthcheck:
      test: "pg_isready -U test_user -d test_database"
      interval: 5s
      timeout: 5s
      retries: 5
    tmpfs:
      - /var/lib/postgresql/data:size=3072M

  redis:
    networks:
      - test_net
    command: [] # Override base redis-server auth command for tests if needed, but test environment uses no password

  db_init:
    <<: *rust-test-base
    image: localhost/leeattend-test_apiserver
    build:
      context: ./apiserver
      target: test
    depends_on:
      db:
        condition: service_healthy
    working_dir: /workspace/apiserver
    environment:
      - DATABASE_URL=postgres://test_user:test_password@db:5432/test_database?sslmode=disable
    entrypoint: ["bash", "-c", "sqlx migrate run && touch /tmp/migration_done && tail -f /dev/null"]
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/migration_done"]
      interval: 2s
      timeout: 5s
      retries: 30

  apiserver:
    <<: *rust-test-base
    image: localhost/leeattend-test_apiserver
    build:
      context: ./apiserver
      target: test
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      db_init:
        condition: service_healthy
    working_dir: /workspace/apiserver
    environment:
      - DATABASE_URL=postgres://test_user:test_password@db:5432/test_database
      - REDIS_URL=redis://redis:6379
    healthcheck:
      test: "echo 'ready'"
      interval: 5s
      timeout: 5s
      retries: 5

  agent-main:
    <<: *rust-test-base
    image: localhost/leeattend-test_agent-main
    build:
      context: ./agent-main
      target: test
    depends_on:
      apiserver:
        condition: service_healthy
    working_dir: /workspace/agent-main
    environment:
      - "DATABASE_URL=:memory:"
      - CENTRAL_SERVER_URL=ws://apiserver:3001/api/ws

  npm_init:
    image: localhost/leeattend-test_webdashboard
    build:
      context: ./webdashboard
      target: test
    networks:
      - test_net
    working_dir: /workspace/webdashboard
    command: npm install --no-audit --no-fund
    environment:
      - npm_config_cache=/workspace/.npm-cache
    volumes:
      - ${PROJECT_ROOT}:/workspace
      - web-node-modules:/workspace/webdashboard/node_modules
      - npm-cache:/workspace/.npm-cache

  webdashboard:
    image: localhost/leeattend-test_webdashboard
    build:
      context: ./webdashboard
      target: test
    tty: true
    networks:
      - test_net
    entrypoint: tail -f /dev/null
    working_dir: /workspace/webdashboard
    environment:
      - CI=true
      - npm_config_cache=/workspace/.npm-cache
    tmpfs:
      - /workspace/webdashboard/test-results:size=128M
      - /workspace/webdashboard/playwright-report:size=64M
    volumes:
      - ${PROJECT_ROOT}:/workspace
      - web-node-modules:/workspace/webdashboard/node_modules
      - shared-data:/workspace/shared
      - npm-cache:/workspace/.npm-cache

volumes:
  target-cache:
    driver: local
  sccache-cache:
    driver: local
  npm-cache:
    driver: local
  web-node-modules:
    driver: local
  shared-data:
    driver: local
    driver_opts: { type: tmpfs, device: tmpfs, o: "size=64M" }
