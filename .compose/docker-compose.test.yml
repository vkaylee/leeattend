# ==============================================================================
# Podman Compose — Go/Web Test Environment
# This file is fully standalone — it does NOT merge with docker-compose.yml.
# Profiles isolate backend (db, redis, apiserver) from frontend
# (webdashboard, bun_init) so phases that only need one side do not
# launch the other.
#
# One PostgreSQL service hosts the single-organization schema in one database.


networks:
  test_net:
    driver: bridge


services:
  db:
    image: public.ecr.aws/docker/library/postgres:18-alpine
    profiles:
      - infra-db
    networks:
      - test_net
    command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off -c max_connections=1000
    environment:
      - POSTGRES_DB=test_database
      - POSTGRES_USER=test_user
      - POSTGRES_PASSWORD=test_password
      - POSTGRES_HOST_AUTH_METHOD=trust
    shm_size: 512mb
    healthcheck:
      test: "pg_isready -U test_user -d test_database"
      interval: 5s
      timeout: 5s
      retries: 5
    tmpfs:
      - /var/lib/postgresql:size=3072M

  pgbouncer:
    image: ${PGBOUNCER_IMAGE:-edoburu/pgbouncer:v1.26.1-p0}
    profiles:
      - infra-db
    networks:
      - test_net
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: test_database
      DB_USER: test_user
      DB_PASSWORD: test_password
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      LISTEN_PORT: "6432"
      MAX_CLIENT_CONN: "200"
      DEFAULT_POOL_SIZE: "25"
      MAX_PREPARED_STATEMENTS: "250"
    ports:
      - "127.0.0.1:${PGBOUNCER_TEST_HOST_PORT:-6433}:6432"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "6432", "-U", "test_user", "-d", "test_database"]
      interval: 5s
      timeout: 5s
      retries: 10


  redis:
    image: public.ecr.aws/docker/library/redis:7-alpine
    profiles:
      - infra-redis
    networks:
      - test_net
    command: []
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5







  apiserver:
    profiles:
      - api
      - int-api
      - lint-api
      - unit-api
      - lint-go
      - unit-go
      - int-go
      - go
    image: localhost/leeattend-test_go
    build:
      context: ..
      dockerfile: .compose/go/Dockerfile
    networks:
      - test_net
    working_dir: /workspace/apiserver
    entrypoint: ["sleep", "infinity"]
    healthcheck:
      test: ["CMD", "go", "version"]
      interval: 5s
      timeout: 5s
      retries: 12
    environment:
      - GOFLAGS=-mod=mod -buildvcs=false
      - DB_PRIMARY_URL=postgres://test_user:test_password@pgbouncer:6432/test_database?sslmode=disable
      - DB_POOLER_TX_URL=postgres://test_user:test_password@pgbouncer:6432/test_database?sslmode=disable
      - DB_POOLER_SESS_URL=postgres://test_user:test_password@pgbouncer:6432/test_database?sslmode=disable
      - DB_READER_URL=postgres://test_user:test_password@pgbouncer:6432/test_database?sslmode=disable
      - PGBOUNCER_HOST=pgbouncer
      - PGBOUNCER_PORT=6432
      - ORGANIZATION_NAME=Test Organization
      - STANDALONE_ADMIN_EMAIL=admin@example.invalid
      - STANDALONE_ADMIN_PASSWORD=test-password
      - LICENSE_PATH=/tmp/license.json
      - LICENSE_PUBLIC_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      - JWT_SECRET=test-jwt-secret-at-least-32-characters-long
    volumes:
      - ${PROJECT_ROOT}:/workspace
      - go-module-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build

  go:
    profiles:
      - go
      - unit-go
      - lint-go
      - int-go
    image: localhost/leeattend-test_go
    build:
      context: ..
      dockerfile: .compose/go/Dockerfile
    networks:
      - test_net
    working_dir: /workspace/apiserver
    entrypoint: ["sleep", "infinity"]
    healthcheck:
      test: ["CMD", "go", "version"]
      interval: 5s
      timeout: 5s
      retries: 12
    environment:
      - GOFLAGS=-mod=mod -buildvcs=false
      - DB_PRIMARY_URL=postgres://test_user:test_password@pgbouncer:6432/test_database?sslmode=disable
      - DB_POOLER_TX_URL=postgres://test_user:test_password@pgbouncer:6432/test_database?sslmode=disable
      - DB_POOLER_SESS_URL=postgres://test_user:test_password@pgbouncer:6432/test_database?sslmode=disable
      - DB_READER_URL=postgres://test_user:test_password@pgbouncer:6432/test_database?sslmode=disable
      - PGBOUNCER_HOST=pgbouncer
      - PGBOUNCER_PORT=6432
      - ORGANIZATION_NAME=Test Organization
      - STANDALONE_ADMIN_EMAIL=admin@example.invalid
      - STANDALONE_ADMIN_PASSWORD=test-password
      - LICENSE_PATH=/tmp/license.json
      - LICENSE_PUBLIC_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      - JWT_SECRET=test-jwt-secret-at-least-32-characters-long
    volumes:
      - ${PROJECT_ROOT}:/workspace
      - go-module-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build

  bun_init:
    profiles:
      - lint-web
      - unit-web
      - e2e-web
      - frontend
      - web
    image: localhost/leeattend-test_webdashboard
    build:
      context: ../webdashboard
      dockerfile: Dockerfile
      target: test
    networks:
      - test_net
    working_dir: /workspace/webdashboard
    environment:
      - NODE_ENV=test
      - BUN_INSTALL_CACHE_DIR=/workspace/.bun-cache
    entrypoint:
      - sh
      - -c
      - |
        bun install
        touch /tmp/bun_init_done
        sleep infinity
    healthcheck:
      test: "test -f /tmp/bun_init_done"
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - ${PROJECT_ROOT}:/workspace
      - ${PROJECT_ROOT}/webdashboard/node_modules:/workspace/webdashboard/node_modules
      - bun-cache:/workspace/.bun-cache

  webdashboard:
    profiles:
      - lint-web
      - unit-web
      - e2e-web
      - frontend
      - web
    image: localhost/leeattend-test_webdashboard
    build:
      context: ../webdashboard
      dockerfile: Dockerfile
      target: test
    tty: true
    depends_on:
      bun_init:
        condition: service_healthy
    networks:
      - test_net
    entrypoint: sleep infinity
    healthcheck:
      test: ["CMD-SHELL", "test -d /workspace/webdashboard"]
      interval: 2s
      timeout: 5s
      retries: 30
    working_dir: /workspace/webdashboard
    environment:
      - NODE_ENV=test
      - CI=true
      - BUN_INSTALL_CACHE_DIR=/workspace/.bun-cache
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ${PROJECT_ROOT}:/workspace
      - ${PROJECT_ROOT}/webdashboard/node_modules:/workspace/webdashboard/node_modules
      - shared-data:/workspace/shared
      - bun-cache:/workspace/.bun-cache
      - ${PROJECT_ROOT}/webdashboard/test-results:/workspace/webdashboard/test-results
      - ${PROJECT_ROOT}/webdashboard/playwright-report:/workspace/webdashboard/playwright-report

volumes:
  shared-data:
    driver: local
  go-module-cache:
    name: leeattend-test_go-module-cache
    driver: local
  go-build-cache:
    name: leeattend-test_go-build-cache
    driver: local
  bun-cache:
    name: leeattend-test_bun-cache
    driver: local
