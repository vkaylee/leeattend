# ==============================================================================
# Podman Compose — Test Environment (Self-Contained)
# ==============================================================================
# This file is fully standalone — it does NOT merge with docker-compose.yml.
# Profiles isolate backend (db, redis, apiserver, agent) from frontend
# (webdashboard, bun_init) so phases that only need one side don't
# launch the other.

networks:
  test_net:
    driver: bridge

x-rust-env-base: &rust-env-base
  CARGO_TARGET_DIR: /workspace/target
  SCCACHE_DIR: /workspace/.sccache
  RUSTC_WRAPPER: sccache

x-rust-test-base: &rust-test-base
  tty: true
  entrypoint: sleep infinity
  networks:
    - test_net
  environment:
    <<: *rust-env-base
  tmpfs:
    - /workspace/target/nextest
    - /workspace/apiserver/storage
  volumes:
    - ${PROJECT_ROOT}:/workspace
    - ${HOME}/.cargo/registry:/usr/local/cargo/registry
    - sccache-cache:/workspace/.sccache

services:
  db_system:
    image: public.ecr.aws/docker/library/postgres:18-alpine
    profiles:
      - infra-db
      - infra-pooler
    networks:
      - test_net
    command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off -c max_connections=1000
    environment:
      - POSTGRES_DB=test_database
      - POSTGRES_USER=test_user
      - POSTGRES_PASSWORD=test_password
      - POSTGRES_HOST_AUTH_METHOD=trust
    shm_size: 512mb
    healthcheck:
      test: "pg_isready -U test_user -d test_database"
      interval: 5s
      timeout: 5s
      retries: 5
    tmpfs:
      - /var/lib/postgresql:size=3072M

  db_workspace:
    image: public.ecr.aws/docker/library/postgres:18-alpine
    profiles:
      - infra-db
      - infra-pooler
    networks:
      - test_net
    command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off -c max_connections=1000
    environment:
      - POSTGRES_DB=tenant_test_db
      - POSTGRES_USER=tenant_test_user
      - POSTGRES_PASSWORD=tenant_test_password
      - POSTGRES_HOST_AUTH_METHOD=trust
    shm_size: 512mb
    healthcheck:
      test: "pg_isready -U tenant_test_user -d tenant_test_db"
      interval: 5s
      timeout: 5s
      retries: 5
    tmpfs:
      - /var/lib/postgresql:size=1024M

  redis:
    image: public.ecr.aws/docker/library/redis:7-alpine
    profiles:
      - infra-redis
    networks:
      - test_net
    command: []
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer_tx:
    image: docker.io/edoburu/pgbouncer:v1.25.2-p0
    profiles:
      - infra-pooler
    networks:
      - test_net
    depends_on:
      db_system:
        condition: service_healthy
    environment:
      - DB_HOST=db_system
      - DB_PORT=5432
      - DB_USER=test_user
      - DB_PASSWORD=test_password
      - DB_NAME=*
      - LISTEN_PORT=6543
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=2000
      - DEFAULT_POOL_SIZE=50
      - MIN_POOL_SIZE=10
      - RESERVE_POOL_SIZE=5
      - RESERVE_POOL_TIMEOUT=5
      - MAX_PREPARED_STATEMENTS=250
      - ADMIN_USERS=tenant_test_user,test_user,postgres
      - AUTH_TYPE=trust
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "6543"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer_sess:
    image: docker.io/edoburu/pgbouncer:v1.25.2-p0
    profiles:
      - infra-pooler
    networks:
      - test_net
    depends_on:
      db_system:
        condition: service_healthy
    environment:
      - DB_HOST=db_system
      - DB_PORT=5432
      - DB_USER=test_user
      - DB_PASSWORD=test_password
      - DB_NAME=*
      - LISTEN_PORT=5452
      - POOL_MODE=session
      - MAX_CLIENT_CONN=2000
      - DEFAULT_POOL_SIZE=50
      - MIN_POOL_SIZE=10
      - RESERVE_POOL_SIZE=5
      - RESERVE_POOL_TIMEOUT=5
      - ADMIN_USERS=tenant_test_user,test_user,postgres
      - AUTH_TYPE=trust
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "5452"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer_tenant_tx:
    image: docker.io/edoburu/pgbouncer:v1.25.2-p0
    profiles:
      - infra-pooler
    networks:
      - test_net
    depends_on:
      db_workspace:
        condition: service_healthy
    environment:
      - DB_HOST=db_workspace
      - DB_PORT=5432
      - DB_USER=tenant_test_user
      - DB_PASSWORD=tenant_test_password
      - DB_NAME=*
      - LISTEN_PORT=6543
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=2000
      - DEFAULT_POOL_SIZE=50
      - MIN_POOL_SIZE=10
      - RESERVE_POOL_SIZE=5
      - RESERVE_POOL_TIMEOUT=5
      - MAX_PREPARED_STATEMENTS=250
      - ADMIN_USERS=tenant_test_user,postgres
      - AUTH_TYPE=trust
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "6543"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer_tenant_sess:
    image: docker.io/edoburu/pgbouncer:v1.25.2-p0
    profiles:
      - infra-pooler
    networks:
      - test_net
    depends_on:
      db_workspace:
        condition: service_healthy
    environment:
      - DB_HOST=db_workspace
      - DB_PORT=5432
      - DB_USER=tenant_test_user
      - DB_PASSWORD=tenant_test_password
      - DB_NAME=*
      - LISTEN_PORT=5452
      - POOL_MODE=session
      - MAX_CLIENT_CONN=2000
      - DEFAULT_POOL_SIZE=50
      - MIN_POOL_SIZE=10
      - RESERVE_POOL_SIZE=5
      - RESERVE_POOL_TIMEOUT=5
      - ADMIN_USERS=tenant_test_user,postgres
      - AUTH_TYPE=trust
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "5452"]
      interval: 5s
      timeout: 5s
      retries: 5

  db_init:
    profiles:
      - infra-db
    <<: *rust-test-base
    image: localhost/leeattend-test_apiserver
    build:
      context: ..
      dockerfile: apiserver/Dockerfile
      target: test
    depends_on:
      db_system:
        condition: service_healthy
    working_dir: /workspace/apiserver
    environment:
      <<: *rust-env-base
      DATABASE_URL: postgres://test_user:test_password@db_system:5432/test_database?sslmode=disable
    entrypoint:
      - bash
      - -c
      - |
        set -e
        until pg_isready -h db_system -U test_user; do
          echo "Waiting for db_system..."
          sleep 1
        done
        diesel migration run --migration-dir ./migrations/system
        diesel migration run --migration-dir ./migrations/tenant
        for i in {1..5}; do
          psql postgres://test_user:test_password@db_system:5432/postgres?sslmode=disable -c "CREATE DATABASE leeattend_test_template TEMPLATE test_database" && break
          echo "Retrying psql..."
          sleep 1
        done
        touch /tmp/db_init_done
        sleep infinity
    healthcheck:
      test: "test -f /tmp/db_init_done"
      interval: 2s
      timeout: 5s
      retries: 10

  apiserver:
    profiles:
      - lint-api
      - unit-api
      - int-api
      - api
    <<: *rust-test-base
    image: localhost/leeattend-test_apiserver
    build:
      context: ..
      dockerfile: apiserver/Dockerfile
      target: test
    working_dir: /workspace/apiserver
    environment:
      <<: *rust-env-base
      DATABASE_POOLER_TX_URL: postgres://test_user:test_password@pgbouncer_tx:6543/test_database
      DATABASE_POOLER_SESS_URL: postgres://test_user:test_password@pgbouncer_sess:5452/test_database
      DATABASE_TENANT_POOLER_TX_URL: postgres://tenant_test_user:tenant_test_password@pgbouncer_tenant_tx:6543/tenant_test_db
      DATABASE_TENANT_POOLER_SESS_URL: postgres://tenant_test_user:tenant_test_password@pgbouncer_tenant_sess:5452/tenant_test_db
      DB_POOLER_TYPE: pgbouncer
      REDIS_URL: redis://redis:6379
      STORAGE_DIR: /workspace/apiserver/storage
    volumes:
      - ${PROJECT_ROOT}:/workspace
      - apiserver-target-cache:/workspace/target
      - ${HOME}/.cargo/registry:/usr/local/cargo/registry
      - sccache-cache:/workspace/.sccache
      - shared-data:/workspace/shared
    healthcheck:
      test: "echo 'ready'"
      interval: 5s
      timeout: 5s
      retries: 5

  agent-main:
    profiles:
      - int-api
      - api
    <<: *rust-test-base
    image: localhost/leeattend-test_agent-main
    build:
      context: ..
      dockerfile: agent-main/Dockerfile
      target: test
    working_dir: /workspace/agent-main
    environment:
      <<: *rust-env-base
      DATABASE_URL: ":memory:"
      CENTRAL_SERVER_URL: ws://apiserver:3001/api/ws
    volumes:
      - ${PROJECT_ROOT}:/workspace
      - agent-target-cache:/workspace/target
      - ${HOME}/.cargo/registry:/usr/local/cargo/registry
      - sccache-cache:/workspace/.sccache

  bun_init:
    profiles:
      - lint-web
      - unit-web
      - e2e-web
      - frontend
      - web
    image: localhost/leeattend-test_webdashboard
    build:
      context: ../webdashboard
      dockerfile: Dockerfile
      target: test
    networks:
      - test_net
    working_dir: /workspace/webdashboard
    environment:
      - NODE_ENV=test
      - BUN_INSTALL_CACHE_DIR=/workspace/.bun-cache
    entrypoint:
      - sh
      - -c
      - |
        bun install
        touch /tmp/bun_init_done
        sleep infinity
    healthcheck:
      test: "test -f /tmp/bun_init_done"
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - ${PROJECT_ROOT}:/workspace
      - web-node-modules:/workspace/webdashboard/node_modules
      - bun-cache:/workspace/.bun-cache

  webdashboard:
    profiles:
      - lint-web
      - unit-web
      - e2e-web
      - frontend
      - web
    image: localhost/leeattend-test_webdashboard
    build:
      context: ../webdashboard
      dockerfile: Dockerfile
      target: test
    tty: true
    depends_on:
      bun_init:
        condition: service_healthy
    networks:
      - test_net
    entrypoint: sleep infinity
    working_dir: /workspace/webdashboard
    environment:
      - NODE_ENV=test
      - CI=true
      - BUN_INSTALL_CACHE_DIR=/workspace/.bun-cache
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ${PROJECT_ROOT}:/workspace
      - web-node-modules:/workspace/webdashboard/node_modules
      - shared-data:/workspace/shared
      - bun-cache:/workspace/.bun-cache
      - ${PROJECT_ROOT}/webdashboard/test-results:/workspace/webdashboard/test-results
      - ${PROJECT_ROOT}/webdashboard/playwright-report:/workspace/webdashboard/playwright-report

volumes:
  apiserver-target-cache:
    name: leeattend-test_apiserver-target-cache
    driver: local
  agent-target-cache:
    name: leeattend-test_agent-target-cache
    driver: local
  sccache-cache:
    name: leeattend-test_sccache-cache
    driver: local
  bun-cache:
    name: leeattend-test_bun-cache
    driver: local
  web-node-modules:
    name: leeattend-test_web-node-modules
    driver: local
  shared-data:
    driver: local
