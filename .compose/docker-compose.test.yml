# ==============================================================================
# Podman Compose — Test Environment (Self-Contained)
# ==============================================================================
# This file is fully standalone — it does NOT merge with docker-compose.yml.
# Profiles isolate backend (db, redis, api-go) from frontend
# (webdashboard, bun_init) so phases that only need one side don't
# launch the other.

networks:
  test_net:
    driver: bridge


services:
  db_system:
    image: public.ecr.aws/docker/library/postgres:18-alpine
    profiles:
      - infra-db
      - infra-pooler
    networks:
      - test_net
    command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off -c max_connections=1000
    environment:
      - POSTGRES_DB=test_database
      - POSTGRES_USER=test_user
      - POSTGRES_PASSWORD=test_password
      - POSTGRES_HOST_AUTH_METHOD=trust
    shm_size: 512mb
    healthcheck:
      test: "pg_isready -U test_user -d test_database"
      interval: 5s
      timeout: 5s
      retries: 5
    tmpfs:
      - /var/lib/postgresql:size=3072M

  db_workspace:
    image: public.ecr.aws/docker/library/postgres:18-alpine
    profiles:
      - infra-db
      - infra-pooler
    networks:
      - test_net
    command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off -c max_connections=1000
    environment:
      - POSTGRES_DB=tenant_test_db
      - POSTGRES_USER=tenant_test_user
      - POSTGRES_PASSWORD=tenant_test_password
      - POSTGRES_HOST_AUTH_METHOD=trust
    shm_size: 512mb
    healthcheck:
      test: "pg_isready -U tenant_test_user -d tenant_test_db"
      interval: 5s
      timeout: 5s
      retries: 5
    tmpfs:
      - /var/lib/postgresql:size=1024M

  redis:
    image: public.ecr.aws/docker/library/redis:7-alpine
    profiles:
      - infra-redis
    networks:
      - test_net
    command: []
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer_tx:
    image: docker.io/edoburu/pgbouncer:v1.25.2-p0
    profiles:
      - infra-pooler
    networks:
      - test_net
    depends_on:
      db_system:
        condition: service_healthy
    environment:
      - DB_HOST=db_system
      - DB_PORT=5432
      - DB_USER=test_user
      - DB_PASSWORD=test_password
      - DB_NAME=*
      - LISTEN_PORT=6543
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=2000
      - DEFAULT_POOL_SIZE=50
      - MIN_POOL_SIZE=10
      - RESERVE_POOL_SIZE=5
      - RESERVE_POOL_TIMEOUT=5
      - MAX_PREPARED_STATEMENTS=250
      - ADMIN_USERS=tenant_test_user,test_user,postgres
      - AUTH_TYPE=trust
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "6543"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer_sess:
    image: docker.io/edoburu/pgbouncer:v1.25.2-p0
    profiles:
      - infra-pooler
    networks:
      - test_net
    depends_on:
      db_system:
        condition: service_healthy
    environment:
      - DB_HOST=db_system
      - DB_PORT=5432
      - DB_USER=test_user
      - DB_PASSWORD=test_password
      - DB_NAME=*
      - LISTEN_PORT=5452
      - POOL_MODE=session
      - MAX_CLIENT_CONN=2000
      - DEFAULT_POOL_SIZE=50
      - MIN_POOL_SIZE=10
      - RESERVE_POOL_SIZE=5
      - RESERVE_POOL_TIMEOUT=5
      - ADMIN_USERS=tenant_test_user,test_user,postgres
      - AUTH_TYPE=trust
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "5452"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer_tenant_tx:
    image: docker.io/edoburu/pgbouncer:v1.25.2-p0
    profiles:
      - infra-pooler
    networks:
      - test_net
    depends_on:
      db_workspace:
        condition: service_healthy
    environment:
      - DB_HOST=db_workspace
      - DB_PORT=5432
      - DB_USER=tenant_test_user
      - DB_PASSWORD=tenant_test_password
      - DB_NAME=*
      - LISTEN_PORT=6543
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=2000
      - DEFAULT_POOL_SIZE=50
      - MIN_POOL_SIZE=10
      - RESERVE_POOL_SIZE=5
      - RESERVE_POOL_TIMEOUT=5
      - MAX_PREPARED_STATEMENTS=250
      - ADMIN_USERS=tenant_test_user,postgres
      - AUTH_TYPE=trust
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "6543"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer_tenant_sess:
    image: docker.io/edoburu/pgbouncer:v1.25.2-p0
    profiles:
      - infra-pooler
    networks:
      - test_net
    depends_on:
      db_workspace:
        condition: service_healthy
    environment:
      - DB_HOST=db_workspace
      - DB_PORT=5432
      - DB_USER=tenant_test_user
      - DB_PASSWORD=tenant_test_password
      - DB_NAME=*
      - LISTEN_PORT=5452
      - POOL_MODE=session
      - MAX_CLIENT_CONN=2000
      - DEFAULT_POOL_SIZE=50
      - MIN_POOL_SIZE=10
      - RESERVE_POOL_SIZE=5
      - RESERVE_POOL_TIMEOUT=5
      - ADMIN_USERS=tenant_test_user,postgres
      - AUTH_TYPE=trust
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "5452"]
      interval: 5s
      timeout: 5s
      retries: 5



  api-go:
    profiles:
      - lint-go
      - unit-go
      - int-go
      - go
    image: localhost/leeattend-test_go
    build:
      context: ..
      dockerfile: .compose/go/Dockerfile
    networks:
      - test_net
    working_dir: /workspace/apiserver
    entrypoint: ["sleep", "infinity"]
    environment:
      - GOFLAGS=-mod=mod -buildvcs=false
    volumes:
      - ${PROJECT_ROOT}:/workspace
      - go-module-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build

  bun_init:
    profiles:
      - lint-web
      - unit-web
      - e2e-web
      - frontend
      - web
    image: localhost/leeattend-test_webdashboard
    build:
      context: ../webdashboard
      dockerfile: Dockerfile
      target: test
    networks:
      - test_net
    working_dir: /workspace/webdashboard
    environment:
      - NODE_ENV=test
      - BUN_INSTALL_CACHE_DIR=/workspace/.bun-cache
    entrypoint:
      - sh
      - -c
      - |
        bun install
        touch /tmp/bun_init_done
        sleep infinity
    healthcheck:
      test: "test -f /tmp/bun_init_done"
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - ${PROJECT_ROOT}:/workspace
      - web-node-modules:/workspace/webdashboard/node_modules
      - bun-cache:/workspace/.bun-cache

  webdashboard:
    profiles:
      - lint-web
      - unit-web
      - e2e-web
      - frontend
      - web
    image: localhost/leeattend-test_webdashboard
    build:
      context: ../webdashboard
      dockerfile: Dockerfile
      target: test
    tty: true
    depends_on:
      bun_init:
        condition: service_healthy
    networks:
      - test_net
    entrypoint: sleep infinity
    working_dir: /workspace/webdashboard
    environment:
      - NODE_ENV=test
      - CI=true
      - BUN_INSTALL_CACHE_DIR=/workspace/.bun-cache
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ${PROJECT_ROOT}:/workspace
      - web-node-modules:/workspace/webdashboard/node_modules
      - shared-data:/workspace/shared
      - bun-cache:/workspace/.bun-cache
      - ${PROJECT_ROOT}/webdashboard/test-results:/workspace/webdashboard/test-results
      - ${PROJECT_ROOT}/webdashboard/playwright-report:/workspace/webdashboard/playwright-report

volumes:
  shared-data:
    driver: local
  go-module-cache:
    name: leeattend-test_go-module-cache
    driver: local
  go-build-cache:
    name: leeattend-test_go-build-cache
    driver: local
