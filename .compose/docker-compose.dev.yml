# LeeAttend development environment. Standalone by design: production-only
# image, TLS, and license inputs must not block local startup.
services:
  db:
    image: public.ecr.aws/docker/library/postgres:18-alpine
    command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off -c max_connections=200
    environment:
      POSTGRES_DB: ${DB_NAME:-leeattend}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      PGTZ: ${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - postgres_dev_data_v18:/var/lib/postgresql
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
  pgbouncer:
    image: ${PGBOUNCER_IMAGE:-edoburu/pgbouncer:v1.26.1-p0}
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-leeattend}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      LISTEN_PORT: "6432"
      MAX_CLIENT_CONN: "200"
      DEFAULT_POOL_SIZE: "25"
      MAX_PREPARED_STATEMENTS: "250"
      CLIENT_TLS_SSLMODE: disable
      SERVER_TLS_SSLMODE: disable
    volumes: []
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U $${DB_USER} -d $${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: public.ecr.aws/docker/library/redis:7-alpine
    command: ["redis-server"]
    volumes:
      - redis_dev_data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  redisinsight:
    image: ghcr.io/redis-developer/redisinsight:latest
    pull_policy: missing
    profiles: ["manual"]
    ports:
      - "5540:5540"
    networks: [backend]
    environment:
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: 6379
      RI_REDIS_ALIAS: LeeAttend-Redis
    depends_on:
      redis:
        condition: service_healthy

  minio:
    image: docker.io/rustfs/rustfs:latest
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-leeattend}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-development-password}
    volumes:
      - minio_dev_data:/data
    networks: [backend]
    healthcheck:
      test: "curl -fsS http://localhost:9000/health/ready >/dev/null"
      interval: 10s
      timeout: 5s
      retries: 10
  cloudbeaver:
    image: docker.io/dbeaver/cloudbeaver:latest
    pull_policy: missing
    ports:
      - "8978:8978"
    networks: [backend]
    environment:
      DB_NAME: ${DB_NAME:-leeattend}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      CB_SERVER_NAME: LeeAttend Dev
      CB_SERVER_URL: http://localhost:8978
      CB_ADMIN_NAME: cbadmin
      CB_ADMIN_PASSWORD: admin
      CLOUDBEAVER_APP_ANONYMOUS_ACCESS_ENABLED: "true"
      CLOUDBEAVER_APP_GRANT_CONNECTIONS_ACCESS_TO_ANONYMOUS_TEAM: "true"
    volumes:
      - cloudbeaver_dev_data:/opt/cloudbeaver/workspace
      - ../.compose/cloudbeaver-entrypoint.sh:/opt/cloudbeaver/cloudbeaver-entrypoint.sh:ro
      - ../.compose/cloudbeaver-initial-data-sources.conf:/opt/cloudbeaver/conf/initial-data-sources.conf.tpl:ro
    entrypoint: /opt/cloudbeaver/cloudbeaver-entrypoint.sh
    depends_on:
      pgbouncer:
        condition: service_healthy

  db-migrate:
    image: public.ecr.aws/docker/library/postgres:18-alpine
    command: ["sh", "/workspace/apiserver/migrations/run-dev.sh"]
    environment:
      POSTGRES_DB: ${DB_NAME:-leeattend}
      POSTGRES_USER: ${DB_USER:-postgres}
      PGPASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - ..:/workspace:ro
    networks: [backend]
    depends_on:
      pgbouncer:
        condition: service_healthy

  apiserver:
    image: golang:1.26.11-bookworm
    working_dir: /app/apiserver
    command: go run .
    environment:
      APP_ENV: development
      APP_HOST: 0.0.0.0
      APP_PORT: "3000"
      GOCACHE: /go/tmp-cache
      GOTMPDIR: /go/tmp
      DB_PRIMARY_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@pgbouncer:6432/${DB_NAME:-leeattend}
      DB_POOLER_TX_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@pgbouncer:6432/${DB_NAME:-leeattend}
      DB_POOLER_SESS_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@pgbouncer:6432/${DB_NAME:-leeattend}
      DB_READER_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@pgbouncer:6432/${DB_NAME:-leeattend}
      PGBOUNCER_HOST: pgbouncer
      PGBOUNCER_PORT: "6432"
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-development_jwt_secret_change_me}
      IDENTITY_LOOKUP_HMAC_SECRET: ${IDENTITY_LOOKUP_HMAC_SECRET:-development_identity_hmac_secret_32b}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      ORGANIZATION_NAME: ${ORGANIZATION_NAME:-Development Organization}
      STANDALONE_ADMIN_EMAIL: ${STANDALONE_ADMIN_EMAIL:-admin@example.invalid}
      STANDALONE_ADMIN_PASSWORD: ${STANDALONE_ADMIN_PASSWORD:-development-password}
      LICENSE_PATH: /tmp/license.json
      LICENSE_PUBLIC_KEY: ${LICENSE_PUBLIC_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA}
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-leeattend}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-leeattend}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-development-password}
      S3_USE_PATH_STYLE: "true"
    read_only: false
    # Keep dependency cache persistent; do not move build/temp paths to disk.
    volumes:
      - ..:/app
      - go-module-cache:/go/pkg/mod
    # Go compiles and runs from these paths. RAM avoids disk writes; exec is
    # required because Kiri mounts tmpfs as noexec unless explicitly overridden.
    tmpfs:
      - /go/tmp-cache:exec
      - /go/tmp:exec
    networks: [backend, frontend]
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: wget -qO- http://localhost:3000/api/v1/health >/dev/null
      interval: 10s
      timeout: 5s
      retries: 12

  webdashboard:
    build:
      context: ../webdashboard
      dockerfile: Dockerfile
      target: dev
    command: >-
      sh -c 'mkdir -p /var/log/app &&
      bun run dev --host 0.0.0.0 2>&1 | tee -a /var/log/app/webdashboard.log'
    environment:
      VITE_API_URL: http://apiserver:3000/api
      CHOKIDAR_USEPOLLING: "true"
    networks: [frontend]
    volumes:
      - ../webdashboard:/app
      - webdashboard-node-modules:/app/node_modules
      - ../logs:/var/log/app

  caddy:
    image: public.ecr.aws/docker/library/caddy:alpine
    pull_policy: missing
    restart: unless-stopped
    networks: [frontend]
    depends_on:
      apiserver:
        condition: service_healthy
      webdashboard:
        condition: service_started
    ports:
      - "${DEV_PORT:-8080}:80"
    volumes:
      - ../Caddyfile-dev:/etc/caddy/Caddyfile:ro

networks:
  # Dev services need outbound access for Go module downloads and image tooling.
  # Keep these distinct from production's internal-only networks.
  backend:
    name: ${COMPOSE_PROJECT_NAME:-leedevkit-dev}_dev_backend
    internal: false
  frontend:
    name: ${COMPOSE_PROJECT_NAME:-leedevkit-dev}_dev_frontend
    internal: false

volumes:
  postgres_dev_data_v18:
  redis_dev_data:
  minio_dev_data:
  webdashboard-node-modules:
  cloudbeaver_dev_data:
  go-module-cache:
