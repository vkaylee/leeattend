# ==============================================================================
# Podman Compose — Development Override
# ==============================================================================
services:
  db_system:
    command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off -c max_connections=200
    ports:
      - "5434:5432"
    volumes:
      - postgres_system_dev_data:/var/lib/postgresql

  db_workspace:
    command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off -c max_connections=200
    ports:
      - "5435:5432"
    volumes:
      - postgres_workspace_dev_data:/var/lib/postgresql

  redis:
    volumes:
      - redis_dev_data:/data

  redisinsight:
    image: ghcr.io/redis-developer/redisinsight:latest
    pull_policy: missing
    profiles: ["manual"]
    ports:
      - "5540:5540"
    networks:
      - backend_net
    environment:
      - RI_REDIS_HOST=redis
      - RI_REDIS_PORT=6379
      - RI_REDIS_PASSWORD=${REDIS_PASSWORD}
      - RI_REDIS_ALIAS=LeeAttend-Redis
    depends_on:
      redis:
        condition: service_healthy

  cloudbeaver:
    image: docker.io/dbeaver/cloudbeaver:latest
    pull_policy: missing
    ports:
      - "8978:8978"
    networks:
      - backend_net
    environment:
      # --- Credentials for entrypoint to inject into data-sources ---
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      # --- CloudBeaver auto-config (skip setup wizard) ---
      - CB_SERVER_NAME=LeeAttend Dev
      - CB_SERVER_URL=http://localhost:8978
      - CB_ADMIN_NAME=cbadmin
      - CB_ADMIN_PASSWORD=admin
      # --- Anonymous access for local dev ---
      - CLOUDBEAVER_APP_ANONYMOUS_ACCESS_ENABLED=true
      - CLOUDBEAVER_APP_GRANT_CONNECTIONS_ACCESS_TO_ANONYMOUS_TEAM=true
    volumes:
      - cloudbeaver_dev_data:/opt/cloudbeaver/workspace
      - ./.compose/cloudbeaver-entrypoint.sh:/opt/cloudbeaver/cloudbeaver-entrypoint.sh:ro
      - ./.compose/cloudbeaver-initial-data-sources.conf:/opt/cloudbeaver/conf/initial-data-sources.conf.tpl:ro
    entrypoint: /opt/cloudbeaver/cloudbeaver-entrypoint.sh
    depends_on:
      db_system:
        condition: service_healthy

  apiserver:
    image: golang:1.26-bookworm
    working_dir: /app/apiserver
    command: go run .
    environment:
      - APP_ENV=development
      - APP_HOST=0.0.0.0
      - APP_PORT=3000
      - DB_PRIMARY_URL=postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db_system:5432/${DB_NAME:-leeattend_system}
      - DB_TENANT_POOLER_TX_URL=postgres://tenant_user:tenant_password@pgbouncer_tenant_tx:6543/tenant_db
      - DB_TENANT_POOLER_SESS_URL=postgres://tenant_user:tenant_password@pgbouncer_tenant_sess:5452/tenant_db
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379
      - JWT_SECRET=${JWT_SECRET:-development_jwt_secret_change_me}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - LOG_PULL_ENABLED=${LOG_PULL_ENABLED:-false}
      - LOG_PULL_BASE_URL=${LOG_PULL_BASE_URL:-https://provider.example.invalid}
      - LOG_PULL_TOKEN=${LOG_PULL_TOKEN:-}
      - LOG_PULL_ACCOUNT_ID=${LOG_PULL_ACCOUNT_ID:-}
      - LOG_PULL_MODE=${LOG_PULL_MODE:-shadow}
    volumes:
      - .:/app
      - go-module-cache:/go/pkg/mod
    depends_on:
      db_system:
        condition: service_healthy
      db_workspace:
        condition: service_healthy
      redis:
        condition: service_healthy

  webdashboard:
    image: localhost/leeattend_dev_webdashboard
    build:
      context: ./webdashboard
      dockerfile: Dockerfile
      target: dev
    command: >-
      sh -c 'mkdir -p /var/log/app &&
      bun run dev --host 0.0.0.0 2>&1 | tee -a /var/log/app/webdashboard.log'
    environment:
      - VITE_API_URL=http://apiserver:3000/api
# Ports are handled by Caddy proxy on port 8080
    # No direct exposure needed for dev server or HMR

    volumes:
      - ./webdashboard:/app
      - webdashboard-node-modules:/app/node_modules
      - ./logs:/var/log/app

  caddy:
    image: public.ecr.aws/docker/library/caddy:alpine
    pull_policy: missing
    restart: unless-stopped
    networks:
      - frontend_net
    depends_on:
      apiserver:
        condition: service_healthy
      webdashboard:
        condition: service_started
    ports:
      - "${DEV_PORT:-8080}:80"
    volumes:
      - ./Caddyfile-dev:/etc/caddy/Caddyfile:ro

volumes:
  postgres_system_dev_data:
  postgres_workspace_dev_data:
  redis_dev_data:
  webdashboard-node-modules:
  cloudbeaver_dev_data:
  go-module-cache:
