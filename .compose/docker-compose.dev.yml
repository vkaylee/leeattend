# ==============================================================================
# Podman Compose — Development Override
# ==============================================================================
services:
  db_system:
    command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off -c max_connections=200
    volumes:
      - postgres_system_dev_data:/var/lib/postgresql

  db_workspace:
    command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off -c max_connections=200
    volumes:
      - postgres_workspace_dev_data:/var/lib/postgresql

  redis:
    volumes:
      - redis_dev_data:/data

  redisinsight:
    image: ghcr.io/redis-developer/redisinsight:latest
    pull_policy: missing
    profiles: ["manual"]
    ports:
      - "5540:5540"
    networks:
      - backend_net
    environment:
      - RI_REDIS_HOST=redis
      - RI_REDIS_PORT=6379
      - RI_REDIS_PASSWORD=${REDIS_PASSWORD}
      - RI_REDIS_ALIAS=LeeAttend-Redis
    depends_on:
      redis:
        condition: service_healthy

  cloudbeaver:
    image: docker.io/dbeaver/cloudbeaver:latest
    pull_policy: missing
    ports:
      - "8978:8978"
    networks:
      - backend_net
    environment:
      # --- Credentials for entrypoint to inject into data-sources ---
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      # --- CloudBeaver auto-config (skip setup wizard) ---
      - CB_SERVER_NAME=LeeAttend Dev
      - CB_SERVER_URL=http://localhost:8978
      - CB_ADMIN_NAME=cbadmin
      - CB_ADMIN_PASSWORD=admin
      # --- Anonymous access for local dev ---
      - CLOUDBEAVER_APP_ANONYMOUS_ACCESS_ENABLED=true
      - CLOUDBEAVER_APP_GRANT_CONNECTIONS_ACCESS_TO_ANONYMOUS_TEAM=true
    volumes:
      - cloudbeaver_dev_data:/opt/cloudbeaver/workspace
      - ./.compose/cloudbeaver-entrypoint.sh:/opt/cloudbeaver/cloudbeaver-entrypoint.sh:ro
      - ./.compose/cloudbeaver-initial-data-sources.conf:/opt/cloudbeaver/conf/initial-data-sources.conf.tpl:ro
    entrypoint: /opt/cloudbeaver/cloudbeaver-entrypoint.sh
    depends_on:
      db_system:
        condition: service_healthy

  apiserver:
    image: localhost/leeattend_dev_apiserver
    build:
      context: .
      dockerfile: apiserver/Dockerfile
      target: dev
    working_dir: /app/apiserver
    command: >-
      sh -c 'mkdir -p /var/log/app &&
      cargo watch -w src -w migrations/system -w migrations/tenant -x run 2>&1 | tee -a /var/log/app/apiserver.log'
    environment:
      - RUST_BACKTRACE=1
      - RUST_LOG=apiserver=debug,tower_http=debug
      - STORAGE_DIR=/app/apiserver/storage
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@db_system:5432/${DB_NAME}
      - DATABASE_POOLER_URL=postgres://${DB_USER}.${SUPAVISOR_TENANT_ID:-${DB_NAME}}:${DB_PASSWORD}@${SUPAVISOR_HOST:-supavisor}:5452/${DB_NAME}
      - SUPAVISOR_API_URL=http://${SUPAVISOR_HOST:-supavisor}:${SUPAVISOR_API_PORT:-4000}
      - SUPAVISOR_TENANT_ID=${SUPAVISOR_TENANT_ID:-}
      - SUPAVISOR_POOL_USER=${SUPAVISOR_POOL_USER:-}
      - SUPAVISOR_POOL_PASSWORD=${SUPAVISOR_POOL_PASSWORD:-}
      - SUPAVISOR_POOL_SIZE=${SUPAVISOR_POOL_SIZE:-20}
      - SUPAVISOR_MODE_TYPE=${SUPAVISOR_MODE_TYPE:-session}
      - SUPAVISOR_IP_VERSION=${SUPAVISOR_IP_VERSION:-v4}
      - API_JWT_SECRET=${SUPAVISOR_API_JWT:-your-super-secret-jwt-token-with-at-least-32-bytes-long}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379
      - 'ENCRYPTION_KEYS_JSON=${ENCRYPTION_KEYS_JSON:-{"keys":{"v1":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="},"active_key":"v1"}}'
    volumes:
      - .:/app
      - cargo-registry:/usr/local/cargo/registry
      - target-cache:/app/target
      - ./logs:/var/log/app

  agent-main:
    image: localhost/leeattend_dev_agent-main
    build:
      context: .
      dockerfile: agent-main/Dockerfile
      target: dev
    working_dir: /app/agent-main
    command: >-
      sh -c 'mkdir -p /var/log/app &&
      cargo watch -w src -x run 2>&1 | tee -a /var/log/app/agent-main.log'
    depends_on:
      caddy:
        condition: service_started
    environment:
      - RUST_LOG=info
      - CENTRAL_SERVER_URL=${AGENT_CENTRAL_SERVER_URL:-ws://caddy:80/api/ws}
      - INFLIGHT_TIMEOUT_SECS=600
      - DATABASE_URL=sqlite:///app/agent-main/data/agent.db
    volumes:
      - .:/app
      - cargo-registry:/usr/local/cargo/registry
      - target-cache:/app/target
      - agent_dev_data:/app/agent-main/data
      - ./logs:/var/log/app

  webdashboard:
    image: localhost/leeattend_dev_webdashboard
    build:
      context: ./webdashboard
      dockerfile: Dockerfile
      target: dev
    command: >-
      sh -c 'mkdir -p /var/log/app &&
      bun run dev --host 0.0.0.0 2>&1 | tee -a /var/log/app/webdashboard.log'
    environment:
      - VITE_API_URL=http://apiserver:3000/api
# Ports are handled by Caddy proxy on port 8080
    # No direct exposure needed for dev server or HMR

    volumes:
      - ./webdashboard:/app
      - webdashboard-node-modules:/app/node_modules
      - ./logs:/var/log/app

  caddy:
    image: public.ecr.aws/docker/library/caddy:alpine
    pull_policy: missing
    restart: unless-stopped
    networks:
      - frontend_net
    depends_on:
      apiserver:
        condition: service_healthy
      webdashboard:
        condition: service_started
    ports:
      - "${DEV_PORT:-8080}:80"
    volumes:
      - ./Caddyfile-dev:/etc/caddy/Caddyfile:ro

volumes:
  postgres_system_dev_data:
  postgres_workspace_dev_data:
  redis_dev_data:
  agent_dev_data:
  target-cache:
  cargo-registry:
  webdashboard-node-modules:
  cloudbeaver_dev_data:
