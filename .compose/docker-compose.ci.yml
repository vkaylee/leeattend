# ==============================================================================
# Podman Compose — CI Override
# ==============================================================================

services:
  apiserver:
    working_dir: /workspace/apiserver
    volumes:
      - ${PROJECT_ROOT:-.}:/workspace
    environment:
      - GOMODCACHE=/go/pkg/mod
      - GOCACHE=/go/cache

  webdashboard:
    working_dir: /app
    volumes:
      - /app/node_modules
