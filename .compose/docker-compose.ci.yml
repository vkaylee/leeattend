# ==============================================================================
# Podman Compose — CI Override
# ==============================================================================

services:
  api-go:
    working_dir: /workspace/apiserver
    volumes:
      - ${PROJECT_ROOT:-.}:/workspace
    environment:
      - GOMODCACHE=/go/pkg/mod
      - GOCACHE=/go/cache

  web_test:
    working_dir: /app
    volumes:
      - /app/node_modules
