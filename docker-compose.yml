services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-leeattend}
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password_required}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d ${DB_NAME:-leeattend}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-dev_password}
    healthcheck:
      test: [ "CMD", "sh", "-c", "redis-cli -a $${REDIS_PASSWORD:-dev_password} ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  apiserver:
    build:
      context: ./apiserver
      dockerfile: Dockerfile
      target: runtime
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:3000/api/health > /dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      - DATABASE_URL=${API_DATABASE_URL:-postgres://${DB_USER:-admin}:${DB_PASSWORD:-password_required}@db:5432/${DB_NAME:-leeattend}}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-dev_password}@redis:6379
      - API_HOST=0.0.0.0
      - API_PORT=3000
      - RUST_LOG=info

  webdashboard:
    build:
      context: ./webdashboard
      dockerfile: Dockerfile
      target: runtime
    restart: always
    depends_on:
      apiserver:
        condition: service_healthy

  agent-main:
    build:
      context: ./agent-main
      dockerfile: Dockerfile
      target: runtime
    restart: always
    depends_on:
      apiserver:
        condition: service_healthy
    environment:
      - CENTRAL_SERVER_URL=${AGENT_CENTRAL_SERVER_URL:-ws://apiserver:3000/api/ws}
      - DATABASE_URL=${AGENT_DATABASE_URL:-sqlite:///app/data/agent.db}
      - RUST_LOG=info
