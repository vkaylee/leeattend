# LeeAttend single-organization Linux appliance.
# Bind this file to a private LAN and place TLS termination in front of webdashboard.
# Production release bundles MUST pin every image by digest before deployment.
services:
  db:
    image: ${POSTGRES_IMAGE:?set POSTGRES_IMAGE}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?set DB_NAME}
      POSTGRES_USER: ${DB_USER:?set DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      PGTZ: ${TZ:-Asia/Ho_Chi_Minh}
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/run/postgres/tls/server.crt
      - -c
      - ssl_key_file=/run/postgres/tls/server.key
    volumes:
      - standalone_db:/var/lib/postgresql
      - ${POSTGRES_TLS_DIR:?set POSTGRES_TLS_DIR}:/run/postgres/tls:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
  pgbouncer:
    image: ${PGBOUNCER_IMAGE:?set PGBOUNCER_IMAGE}
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:?set DB_NAME}
      DB_USER: ${DB_USER:?set DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      LISTEN_PORT: "6432"
      MAX_CLIENT_CONN: "200"
      DEFAULT_POOL_SIZE: "25"
      MAX_PREPARED_STATEMENTS: "250"
      CLIENT_TLS_SSLMODE: require
      CLIENT_TLS_CERT_FILE: /run/pgbouncer/tls/server.crt
      CLIENT_TLS_KEY_FILE: /run/pgbouncer/tls/server.key
      SERVER_TLS_SSLMODE: require
    volumes:
      - ${PGBOUNCER_TLS_DIR:?set PGBOUNCER_TLS_DIR}:/run/pgbouncer/tls:ro
    networks: [backend]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "6432", "-U", "${DB_USER}", "-d", "${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: ${REDIS_IMAGE:?set REDIS_IMAGE}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - standalone_redis:/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
  minio:
    image: ${MINIO_IMAGE:?set MINIO_IMAGE}
    restart: unless-stopped
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - standalone_files:/data
    networks: [backend]
    healthcheck:
      test: mc ready local
      interval: 10s
      timeout: 5s
      retries: 10
  apiserver:
    image: ${APISERVER_IMAGE:?set APISERVER_IMAGE}
    read_only: true
    tmpfs:
      - /tmp
    environment:
      APP_PORT: "3000"
      DB_PRIMARY_URL: postgres://${DB_USER}:${DB_PASSWORD}@pgbouncer:6432/${DB_NAME}?sslmode=require
      DB_POOLER_TX_URL: postgres://${DB_USER}:${DB_PASSWORD}@pgbouncer:6432/${DB_NAME}?sslmode=require
      DB_POOLER_SESS_URL: postgres://${DB_USER}:${DB_PASSWORD}@pgbouncer:6432/${DB_NAME}?sslmode=require
      DB_READER_URL: postgres://${DB_USER}:${DB_PASSWORD}@pgbouncer:6432/${DB_NAME}?sslmode=require
      PGBOUNCER_HOST: pgbouncer
      PGBOUNCER_PORT: "6432"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      ENCRYPTION_KEYS_JSON: ${ENCRYPTION_KEYS_JSON:?set ENCRYPTION_KEYS_JSON}
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-leeattend}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_USE_PATH_STYLE: "true"
      STORAGE_DIR: /app/storage
      ORGANIZATION_NAME: ${ORGANIZATION_NAME:?set ORGANIZATION_NAME}
      STANDALONE_ADMIN_EMAIL: ${STANDALONE_ADMIN_EMAIL:?set STANDALONE_ADMIN_EMAIL}
      STANDALONE_ADMIN_PASSWORD: ${STANDALONE_ADMIN_PASSWORD:?set STANDALONE_ADMIN_PASSWORD}
      LICENSE_PATH: /run/leeattend/license.json
      LICENSE_PUBLIC_KEY: ${LICENSE_PUBLIC_KEY:?set LICENSE_PUBLIC_KEY}
    volumes:
      - standalone_storage:/app/storage
      - ${LICENSE_FILE:?set LICENSE_FILE}:/run/leeattend/license.json:ro
    networks: [backend, frontend]
    depends_on:
      pgbouncer: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/usr/local/bin/apiserver", "--healthcheck", "http://127.0.0.1:3000/api/v1/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
  webdashboard:
    image: ${WEBDASHBOARD_IMAGE:?set WEBDASHBOARD_IMAGE}
    restart: unless-stopped
    networks: [frontend]
    depends_on:
      apiserver: { condition: service_started }

networks:
  backend:
    internal: true
    name: ${COMPOSE_PROJECT_NAME:-leeattend}_backend
  frontend:
    internal: true
    name: ${COMPOSE_PROJECT_NAME:-leeattend}_frontend
  backend_net:
    name: ${COMPOSE_PROJECT_NAME:-leeattend}_backend
  frontend_net:
    name: ${COMPOSE_PROJECT_NAME:-leeattend}_frontend

volumes:
  standalone_db:
  standalone_redis:
  standalone_files:
  standalone_storage:
