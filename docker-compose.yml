services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-leeatt}
      POSTGRES_USER: ${DB_USER:-lee}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password_required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-lee} -d ${DB_NAME:-leeatt}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  apiserver:
    build:
      context: ./apiserver
      dockerfile: Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://${DB_USER:-lee}:${DB_PASSWORD:-password_required}@db:5432/${DB_NAME:-leeatt}
      - REDIS_URL=redis://redis:6379
      - API_HOST=0.0.0.0
      - API_PORT=3000
      - RUST_LOG=info
    volumes:
      - ./apiserver/storage:/app/storage
    expose:
      - "3000"

  webdashboard:
    build:
      context: ./webdashboard
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - apiserver
    ports:
      - "80:80"
    environment:
      - VITE_API_BASE_URL=/api

  agent-main:
    build:
      context: ./agent-main
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - apiserver
    environment:
      - CENTRAL_SERVER_URL=ws://apiserver:3000/api/ws
      - DATABASE_URL=sqlite:///app/data/agent.db
      - RUST_LOG=info
    volumes:
      - agent_data:/app/data

volumes:
  postgres_data:
  redis_data:
  agent_data:
