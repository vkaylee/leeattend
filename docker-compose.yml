# ==============================================================================
# Podman Compose — Production Base
# ==============================================================================
networks:
  backend_net:
    driver: bridge
  frontend_net:
    driver: bridge

x-healthcheck-base: &healthcheck-base
  interval: 10s
  timeout: 5s
  retries: 5

services:
  db_system:
    image: public.ecr.aws/docker/library/postgres:18-alpine
    restart: always
    networks:
      - backend_net
    environment:
      - TZ=Asia/Bangkok
      - PGTZ=Asia/Bangkok
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    healthcheck:
      <<: *healthcheck-base
      test: "pg_isready -U ${DB_USER} -d ${DB_NAME}"

  db_workspace:
    image: public.ecr.aws/docker/library/postgres:18-alpine
    restart: always
    networks:
      - backend_net
    environment:
      - TZ=Asia/Bangkok
      - PGTZ=Asia/Bangkok
      - POSTGRES_DB=tenant_db
      - POSTGRES_USER=tenant_user
      - POSTGRES_PASSWORD=tenant_password
    healthcheck:
      <<: *healthcheck-base
      test: "pg_isready -U tenant_user -d tenant_db"


  db_legacy:
    image: public.ecr.aws/docker/library/postgres:18-alpine
    profiles: ["migration"]
    restart: "no"
    ports:
      - "5433:5432"
    networks:
      - backend_net
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      - ./dbbackup:/dbbackup:ro
    healthcheck:
      <<: *healthcheck-base
      test: "pg_isready -U postgres"


  redis:
    image: public.ecr.aws/docker/library/redis:7-alpine
    restart: always
    networks:
      - backend_net
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      <<: *healthcheck-base
      test: [ "CMD", "sh", "-c", "redis-cli -a ${REDIS_PASSWORD} ping" ]

  pgbouncer_tx:
    image: docker.io/edoburu/pgbouncer:v1.25.2-p0
    restart: always
    networks:
      - backend_net
    depends_on:
      db_system:
        condition: service_healthy
    environment:
      - DB_HOST=db_system
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=*
      - LISTEN_PORT=6543
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=2000
      - DEFAULT_POOL_SIZE=50
      - MIN_POOL_SIZE=10
      - RESERVE_POOL_SIZE=5
      - RESERVE_POOL_TIMEOUT=5
      - MAX_PREPARED_STATEMENTS=250
      - ADMIN_USERS=tenant_user,postgres
      - AUTH_TYPE=trust
    healthcheck:
      <<: *healthcheck-base
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "6543"]

  pgbouncer_sess:
    image: docker.io/edoburu/pgbouncer:v1.25.2-p0
    restart: always
    networks:
      - backend_net
    depends_on:
      db_system:
        condition: service_healthy
    environment:
      - DB_HOST=db_system
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=*
      - LISTEN_PORT=5452
      - POOL_MODE=session
      - MAX_CLIENT_CONN=2000
      - DEFAULT_POOL_SIZE=50
      - MIN_POOL_SIZE=10
      - RESERVE_POOL_SIZE=5
      - RESERVE_POOL_TIMEOUT=5
      - ADMIN_USERS=tenant_user,postgres
      - AUTH_TYPE=trust
    healthcheck:
      <<: *healthcheck-base
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "5452"]

  pgbouncer_tenant_tx:
    image: docker.io/edoburu/pgbouncer:v1.25.2-p0
    restart: always
    networks:
      - backend_net
    depends_on:
      db_workspace:
        condition: service_healthy
    environment:
      - DB_HOST=db_workspace
      - DB_PORT=5432
      - DB_USER=tenant_user
      - DB_PASSWORD=tenant_password
      - DB_NAME=*
      - LISTEN_PORT=6543
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=2000
      - DEFAULT_POOL_SIZE=50
      - MIN_POOL_SIZE=10
      - RESERVE_POOL_SIZE=5
      - RESERVE_POOL_TIMEOUT=5
      - MAX_PREPARED_STATEMENTS=250
      - ADMIN_USERS=tenant_user,postgres
      - AUTH_TYPE=trust
    healthcheck:
      <<: *healthcheck-base
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "6543"]

  pgbouncer_tenant_sess:
    image: docker.io/edoburu/pgbouncer:v1.25.2-p0
    restart: always
    networks:
      - backend_net
    depends_on:
      db_workspace:
        condition: service_healthy
    environment:
      - DB_HOST=db_workspace
      - DB_PORT=5432
      - DB_USER=tenant_user
      - DB_PASSWORD=tenant_password
      - DB_NAME=*
      - LISTEN_PORT=5452
      - POOL_MODE=session
      - MAX_CLIENT_CONN=2000
      - DEFAULT_POOL_SIZE=50
      - MIN_POOL_SIZE=10
      - RESERVE_POOL_SIZE=5
      - RESERVE_POOL_TIMEOUT=5
      - ADMIN_USERS=tenant_user,postgres
      - AUTH_TYPE=trust
    healthcheck:
      <<: *healthcheck-base
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "5452"]

  apiserver:
    image: localhost/leeattend_apiserver
    build:
      context: .
      dockerfile: apiserver/Dockerfile
      target: runtime
    environment:
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@db_system:5432/${DB_NAME}
      - DATABASE_POOLER_TX_URL=postgres://${DB_USER}:${DB_PASSWORD}@pgbouncer_tx:6543/${DB_NAME}
      - DATABASE_POOLER_SESS_URL=postgres://${DB_USER}:${DB_PASSWORD}@pgbouncer_sess:5452/${DB_NAME}
      - DATABASE_TENANT_POOLER_TX_URL=postgres://tenant_user:tenant_password@pgbouncer_tenant_tx:6543/tenant_db
      - DATABASE_TENANT_POOLER_SESS_URL=postgres://tenant_user:tenant_password@pgbouncer_tenant_sess:5452/tenant_db
      - DB_POOLER_TYPE=pgbouncer
      - DB_API_MAX_CONN=${DB_API_MAX_CONN:-20}
      - DB_WORKER_MAX_CONN=${DB_WORKER_MAX_CONN:-5}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - API_HOST=0.0.0.0
      - API_PORT=3000
      - JWT_SECRET=${JWT_SECRET}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-}
      - RUST_LOG=${RUST_LOG:-info}
      - STORAGE_DIR=/app/storage
      - ENCRYPTION_KEYS_JSON=${ENCRYPTION_KEYS_JSON}
    restart: always
    networks:
      - backend_net
      - frontend_net
    volumes:
      - apiserver_storage:/app/storage
    depends_on:
      db_system:
        condition: service_healthy
      db_workspace:
        condition: service_healthy
      redis:
        condition: service_healthy
      pgbouncer_tx:
        condition: service_healthy
      pgbouncer_sess:
        condition: service_healthy
      pgbouncer_tenant_tx:
        condition: service_healthy
      pgbouncer_tenant_sess:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-base
      test: "wget -qO- http://localhost:3000/api/v1/health > /dev/null || exit 1"


  webdashboard:
    image: localhost/leeattend_webdashboard
    build:
      context: ./webdashboard
      dockerfile: Dockerfile
      target: runtime
    restart: always
    networks:
      - frontend_net
    depends_on:
      apiserver:
        condition: service_healthy

  agent-main:
    image: localhost/leeattend_agent-main
    build:
      context: .
      dockerfile: agent-main/Dockerfile
      target: runtime
    restart: always
    networks:
      - backend_net
      - frontend_net
    depends_on:
      webdashboard:
        condition: service_started
    environment:
      - CENTRAL_SERVER_URL=${AGENT_CENTRAL_SERVER_URL:-ws://webdashboard:80/api/ws}
      - DATABASE_URL=${AGENT_DATABASE_URL:-sqlite:///app/data/agent.db}
      - AGENT_ID=${AGENT_ID}
      - AGENT_TOKEN=${AGENT_TOKEN}
      - MAX_MEMORY_LOGS=${MAX_MEMORY_LOGS:-100000}
      - RUST_LOG=${RUST_LOG:-info}

volumes:
  apiserver_storage:
