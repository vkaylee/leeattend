# ==============================================================================
# Podman Compose — Production Base
# ==============================================================================
networks:
  backend_net:
    driver: bridge
  frontend_net:
    driver: bridge

x-healthcheck-base: &healthcheck-base
  interval: 10s
  timeout: 5s
  retries: 5

services:
  db:
    image: docker.io/library/postgres:16-alpine
    restart: always
    networks:
      - backend_net
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      <<: *healthcheck-base
      test: "pg_isready -U ${DB_USER} -d ${DB_NAME}"

  redis:
    image: docker.io/library/redis:7-alpine
    restart: always
    networks:
      - backend_net
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      <<: *healthcheck-base
      test: [ "CMD", "sh", "-c", "redis-cli -a ${REDIS_PASSWORD} ping" ]

  apiserver:
    image: localhost/leeattend_apiserver
    build:
      context: ./apiserver
      dockerfile: Dockerfile
      target: runtime
      args:
        DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    restart: always
    networks:
      - backend_net
      - frontend_net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-base
      test: "wget -qO- http://localhost:3000/api/health > /dev/null || exit 1"
    environment:
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - DATABASE_READER_URL=${DATABASE_READER_URL:-}
      - DB_API_MAX_CONN=${DB_API_MAX_CONN:-20}
      - DB_WORKER_MAX_CONN=${DB_WORKER_MAX_CONN:-5}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - API_HOST=0.0.0.0
      - API_PORT=3000
      - JWT_SECRET=${JWT_SECRET}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - RUST_LOG=${RUST_LOG:-info}

  webdashboard:
    image: localhost/leeattend_webdashboard
    build:
      context: ./webdashboard
      dockerfile: Dockerfile
      target: runtime
    restart: always
    networks:
      - frontend_net
    depends_on:
      apiserver:
        condition: service_healthy

  agent-main:
    image: localhost/leeattend_agent-main
    build:
      context: ./agent-main
      dockerfile: Dockerfile
      target: runtime
    restart: always
    networks:
      - backend_net
      - frontend_net
    depends_on:
      webdashboard:
        condition: service_started
    environment:
      - CENTRAL_SERVER_URL=${AGENT_CENTRAL_SERVER_URL:-ws://webdashboard:80/api/ws}
      - DATABASE_URL=${AGENT_DATABASE_URL:-sqlite:///app/data/agent.db}
      - AGENT_ID=${AGENT_ID}
      - AGENT_TOKEN=${AGENT_TOKEN}
      - MAX_MEMORY_LOGS=${MAX_MEMORY_LOGS:-100000}
      - RUST_LOG=${RUST_LOG:-info}
