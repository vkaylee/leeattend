# ==============================================================================
# Podman Compose — Production Base
# ==============================================================================
networks:
  backend_net:
    driver: bridge
  frontend_net:
    driver: bridge

x-healthcheck-base: &healthcheck-base
  interval: 10s
  timeout: 5s
  retries: 5

services:
  db:
    image: public.ecr.aws/docker/library/postgres:16-alpine
    restart: always
    networks:
      - backend_net
    environment:
      - TZ=Asia/Bangkok
      - PGTZ=Asia/Bangkok
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    healthcheck:
      <<: *healthcheck-base
      test: "pg_isready -U ${DB_USER} -d ${DB_NAME}"

  redis:
    image: public.ecr.aws/docker/library/redis:7-alpine
    restart: always
    networks:
      - backend_net
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      <<: *healthcheck-base
      test: [ "CMD", "sh", "-c", "redis-cli -a ${REDIS_PASSWORD} ping" ]

  supavisor:
    image: supabase/supavisor:2.7.4
    restart: always
    networks:
      - backend_net
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=ecto://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - CLUSTER_POSTGRES=true
      - SECRET_KEY_BASE=${SUPAVISOR_SECRET_KEY:-this_is_a_64_character_secret_key_base_that_needs_to_be_long_enough_12345678901234}
      - VAULT_ENC_KEY=${SUPAVISOR_VAULT_KEY:-this-is-a-32-character-secret-32}
      - API_JWT_SECRET=${SUPAVISOR_API_JWT:-your-super-secret-jwt-token-with-at-least-32-bytes-long}
      - PORT=4000
      - PROXY_PORT_TRANSACTION=6543
      - PROXY_PORT_SESSION=5452
      - REGION=local
    command: >
      sh -c "
      /app/bin/migrate;
      exec /app/bin/server
      "
    healthcheck:
      <<: *healthcheck-base
      # Note: Supavisor does not have a standard /api/health out-of-the-box on 4000, 
      # but checking if the port is open is sufficient for healthcheck
      test: [ "CMD", "curl", "-s", "-o", "/dev/null", "http://localhost:4000" ]

  apiserver:
    image: localhost/leeattend_apiserver
    build:
      context: .
      dockerfile: apiserver/Dockerfile
      target: runtime
    environment:
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - DATABASE_POOLER_URL=postgres://${SUPAVISOR_POOL_USER:-${DB_USER}}.${SUPAVISOR_TENANT_ID:-${DB_NAME}}:${SUPAVISOR_POOL_PASSWORD:-${DB_PASSWORD}}@${SUPAVISOR_HOST:-supavisor}:${SUPAVISOR_PORT:-5452}/${DB_NAME}
      - SUPAVISOR_API_URL=http://${SUPAVISOR_HOST:-supavisor}:${SUPAVISOR_API_PORT:-4000}
      - SUPAVISOR_TENANT_ID=${SUPAVISOR_TENANT_ID:-}
      - SUPAVISOR_POOL_USER=${SUPAVISOR_POOL_USER:-}
      - SUPAVISOR_POOL_PASSWORD=${SUPAVISOR_POOL_PASSWORD:-}
      - SUPAVISOR_POOL_SIZE=${SUPAVISOR_POOL_SIZE:-20}
      - SUPAVISOR_MODE_TYPE=${SUPAVISOR_MODE_TYPE:-session}
      - SUPAVISOR_IP_VERSION=${SUPAVISOR_IP_VERSION:-v4}
      - API_JWT_SECRET=${SUPAVISOR_API_JWT:-your-super-secret-jwt-token-with-at-least-32-bytes-long}
      - DB_API_MAX_CONN=${DB_API_MAX_CONN:-20}
      - DB_WORKER_MAX_CONN=${DB_WORKER_MAX_CONN:-5}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
    restart: always
    networks:
      - backend_net
      - frontend_net
    volumes:
      - apiserver_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      supavisor:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-base
      test: "wget -qO- http://localhost:3000/api/health > /dev/null || exit 1"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=3000
      - JWT_SECRET=${JWT_SECRET}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-}
      - RUST_LOG=${RUST_LOG:-info}
      - STORAGE_DIR=/app/storage
      - ENCRYPTION_KEYS_JSON=${ENCRYPTION_KEYS_JSON}

  webdashboard:
    image: localhost/leeattend_webdashboard
    build:
      context: ./webdashboard
      dockerfile: Dockerfile
      target: runtime
    restart: always
    networks:
      - frontend_net
    depends_on:
      apiserver:
        condition: service_healthy

  agent-main:
    image: localhost/leeattend_agent-main
    build:
      context: .
      dockerfile: agent-main/Dockerfile
      target: runtime
    restart: always
    networks:
      - backend_net
      - frontend_net
    depends_on:
      webdashboard:
        condition: service_started
    environment:
      - CENTRAL_SERVER_URL=${AGENT_CENTRAL_SERVER_URL:-ws://webdashboard:80/api/ws}
      - DATABASE_URL=${AGENT_DATABASE_URL:-sqlite:///app/data/agent.db}
      - AGENT_ID=${AGENT_ID}
      - AGENT_TOKEN=${AGENT_TOKEN}
      - MAX_MEMORY_LOGS=${MAX_MEMORY_LOGS:-100000}
      - RUST_LOG=${RUST_LOG:-info}

volumes:
  apiserver_storage:
