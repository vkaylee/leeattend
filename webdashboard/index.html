<!doctype html>
<html lang="en" class="transition-colors duration-200">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>LeeAttend Dashboard</title>
    <meta name="description" content="LeeAttend Enterprise RBAC HRM SAAS" />
    <meta property="og:title" content="LeeAttend Dashboard" />
    <meta property="og:description" content="LeeAttend Enterprise RBAC HRM SAAS" />
    <meta property="og:type" content="website" />
    <script>
      (function() {
        try {
          var storedTheme = localStorage.getItem('theme_mode');
          var isDark = storedTheme === 'dark' ||
            (!storedTheme || storedTheme === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (isDark) document.documentElement.classList.add('dark');
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
